name: macOS package and release

# Keep this workflow alongside the workspace's root Cargo.toml.
on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Apple Silicon bundle without signing secrets
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # macos-15 defaults to Xcode 16.4. The Tensor library needs a macOS 26 SDK.
      PRIVATE_TRANSLATE_METAL_DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Require the Metal Toolchain for packaging
        timeout-minutes: 20
        run: |
          xcodebuild -version
          xcrun -sdk macosx --show-sdk-version
          if [[ ! -d "$PRIVATE_TRANSLATE_METAL_DEVELOPER_DIR" ]]; then
            echo "::error::Xcode 26.3 is missing from the macos-15 runner."
            exit 1
          fi
          metal_xcrun() {
            DEVELOPER_DIR="$PRIVATE_TRANSLATE_METAL_DEVELOPER_DIR" xcrun -sdk macosx "$@"
          }
          DEVELOPER_DIR="$PRIVATE_TRANSLATE_METAL_DEVELOPER_DIR" xcodebuild -version
          metal_xcrun --show-sdk-version
          if ! metal_xcrun metal --version || ! metal_xcrun metallib --version; then
            DEVELOPER_DIR="$PRIVATE_TRANSLATE_METAL_DEVELOPER_DIR" xcodebuild -downloadComponent MetalToolchain || {
              echo "::error::Could not install the Metal Toolchain for Xcode 26.3."
              exit 1
            }
          fi
          if ! metal_xcrun metal --version || ! metal_xcrun metallib --version; then
            echo "::error::Packaging requires working metal and metallib tools in Xcode 26.3."
            exit 1
          fi

      - name: Check the release version
        if: github.ref_type == 'tag'
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$version" != "$crate" ]]; then
            echo "::error::The release tag must match the workspace version."
            exit 1
          fi
          if ! grep -Eq "^## \\[${version//./\\.}\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated section for this release."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the notice generator
        run: scripts/local-dev.sh install cargo-about --version 0.9.3 --features cli --locked

      - name: Fetch pinned PDF resources
        run: |
          mkdir -p "$RUNNER_TEMP/pdfium" "$RUNNER_TEMP/ipafont"
          cd "$RUNNER_TEMP"
          curl -fsSL 'https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8165/pdfium-mac-arm64.tgz' -o pdfium.tgz
          curl -fsSL 'https://moji.or.jp/wp-content/ipafont/IPAfont/IPAfont00303.zip' -o ipafont.zip
          shasum -a 256 -c <<'SHA256'
          112e74d717f3e0310273b70f3c8780e8a61ff11b34834124465c8305c841d350  pdfium.tgz
          f755ed79a4b8e715bed2f05a189172138aedf93db0f465b4e20c344a02766fe5  ipafont.zip
          SHA256
          tar -xf pdfium.tgz -C pdfium
          unzip -q ipafont.zip -d ipafont
          echo "PRIVATE_TRANSLATE_LOCAL_PDFIUM_DIR=$RUNNER_TEMP/pdfium" >> "$GITHUB_ENV"
          echo "PRIVATE_TRANSLATE_LOCAL_IPAFONT_DIR=$RUNNER_TEMP/ipafont/IPAfont00303" >> "$GITHUB_ENV"

      - name: Build, package and smoke test with ad-hoc signing
        if: github.event_name == 'pull_request'
        run: scripts/package-macos.sh

      - name: Build the unsigned release bundle
        if: github.ref_type == 'tag'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/package-macos.sh build
          tar -cf "$RUNNER_TEMP/unsigned-macos.tar" -C dist "private-translate-$PACKAGE_VERSION-macos-arm64"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: github.ref_type == 'tag'
        with:
          name: unsigned-macos
          path: ${{ runner.temp }}/unsigned-macos.tar
          if-no-files-found: error

  sign:
    name: Sign and notarize the Apple Silicon release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    outputs:
      version: ${{ needs.build.outputs.version }}
    env:
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: unsigned-macos
          path: ${{ runner.temp }}/unsigned-macos

      - name: Unpack the unsigned bundle
        run: |
          mkdir dist
          tar -xf "$RUNNER_TEMP/unsigned-macos/unsigned-macos.tar" -C dist \
            "private-translate-$PACKAGE_VERSION-macos-arm64"

      - name: Sign, notarize and staple the app and disk image
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
        run: |
          set +x
          : "${MACOS_CERTIFICATE_P12_BASE64:?Missing MACOS_CERTIFICATE_P12_BASE64}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD}"
          : "${NOTARY_KEY_ID:?Missing MACOS_NOTARY_KEY_ID}"
          : "${NOTARY_ISSUER_ID:?Missing MACOS_NOTARY_ISSUER_ID}"
          : "${MACOS_NOTARY_KEY_P8_BASE64:?Missing MACOS_NOTARY_KEY_P8_BASE64}"

          umask 077
          signing_dir="$RUNNER_TEMP/private-translate-signing"
          mkdir "$signing_dir"
          keychain="$signing_dir/signing.keychain-db"
          cleanup() {
            rm -f "$signing_dir/certificate.p12" "$signing_dir/notary.p8"
            if [[ -f "$keychain" ]]; then
              security lock-keychain "$keychain" || true
              security delete-keychain "$keychain"
            fi
            rmdir "$signing_dir"
          }
          trap cleanup EXIT
          trap 'exit 1' HUP INT TERM
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$signing_dir/certificate.p12"
          printf '%s' "$MACOS_NOTARY_KEY_P8_BASE64" | base64 -D > "$signing_dir/notary.p8"
          unset MACOS_CERTIFICATE_P12_BASE64 MACOS_NOTARY_KEY_P8_BASE64

          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$signing_dir/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$password" "$keychain" >/dev/null
          rm -f "$signing_dir/certificate.p12"
          unset password MACOS_CERTIFICATE_PASSWORD

          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/"Developer ID Application:/{ print $2 }')
          if [[ ! "$identity" =~ ^[A-F0-9]{40}$ ]]; then
            echo "::error::Expected exactly one valid Developer ID Application signing identity."
            exit 1
          fi
          # The runner is ephemeral. Include the temporary keychain when codesign
          # builds the certificate chain, and delete it when this step exits.
          security list-keychains -d user -s "$keychain"
          CODESIGN_IDENTITY="$identity" CODESIGN_KEYCHAIN="$keychain" \
            NOTARY_KEY_FILE="$signing_dir/notary.p8" scripts/package-macos.sh sign

      - name: Remove signing credentials
        if: always()
        run: |
          signing_dir="$RUNNER_TEMP/private-translate-signing"
          keychain="$signing_dir/signing.keychain-db"
          rm -f "$signing_dir/certificate.p12" "$signing_dir/notary.p8"
          if [[ -f "$keychain" ]]; then
            security lock-keychain "$keychain" || true
            security delete-keychain "$keychain"
          fi
          if [[ -d "$signing_dir" ]]; then
            rmdir "$signing_dir"
          fi

      - name: Checksum the stapled image
        run: shasum -a 256 "private-translate-$PACKAGE_VERSION-macos-arm64.dmg" > SHA256SUMS.txt

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: signed-macos
          path: |
            private-translate-${{ needs.build.outputs.version }}-macos-arm64.dmg
            SHA256SUMS.txt
          if-no-files-found: error

  verify:
    name: Verify and smoke test the stapled Apple Silicon release
    needs: sign
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: signed-macos

      - name: Checksum and smoke test the signed bundle from the stapled disk image
        env:
          PACKAGE_VERSION: ${{ needs.sign.outputs.version }}
          PACKAGE_VERIFY_NOTARIZATION: "1"
        run: |
          shasum -a 256 -c SHA256SUMS.txt
          scripts/package-macos.sh smoke

  draft:
    name: Upload a draft GitHub release
    if: github.ref_type == 'tag'
    needs: [build, sign, verify]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: signed-macos
          path: packages

      - name: Verify and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          (cd packages && sha256sum --check SHA256SUMS.txt)
          scripts/changelog.sh "$VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            "packages/private-translate-$VERSION-macos-arm64.dmg" packages/SHA256SUMS.txt \
            --draft --verify-tag --title "Private Translate $VERSION" --notes-file notes.md
