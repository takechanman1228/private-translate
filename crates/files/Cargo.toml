[package]
name = "files"
description = "Local document extraction and non-destructive file export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["pdf-erase"]
# Opt-in developer checks requiring qpdf and Poppler; excluded from Windows CI.
pdf-external-tests = ["pdf-erase"]
pdf-erase = []
probe-inference = ["dep:engine"]

[dependencies]
unicode-segmentation.workspace = true
engine = { workspace = true, optional = true }
encoding_rs = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }
pdfium-render = { version = "=0.8.37", default-features = false, features = ["pdfium_latest", "thread_safe"] }
ttf-parser = "0.25"
# Also used without pdf-erase to verify empty AcroForms during admission.
lopdf = { path = "../../patches/lopdf", version = "=0.46.0", default-features = false }
thiserror.workspace = true
tempfile = "3"
quick-xml = "0.41"
regex = "1"
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
anyhow.workspace = true
serde_json.workspace = true

