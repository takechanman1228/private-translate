[package]
name = "babeldoc"
description = "Bridge between the app's in-process model and the external babeldoc-engine command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The library never links BabelDOC (AGPL-3.0): it only starts the babeldoc-engine command as a
# separate process and serves it translations over a loopback socket. It does not depend on the
# `engine` crate either: the caller passes the translate function.
[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
anyhow.workspace = true
engine.workspace = true
