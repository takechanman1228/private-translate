setup.about_mac:
  en: "This downloads an AI translation model to this Mac. Your text and translations never leave this Mac."
  ja: "翻訳用の AI モデルをこの Mac にダウンロードします。原文と訳文は、この Mac の外に送りません。"
  zh-Hans: "这会将 AI 翻译模型下载到这台 Mac。原文和译文始终保留在这台 Mac 上。"
  zh-Hant: "這會將 AI 翻譯模型下載到這台 Mac。原文和譯文都會留在這台 Mac 上。"
  ko: "번역용 AI 모델을 이 Mac에 다운로드합니다. 원문과 번역문은 이 Mac 밖으로 전송되지 않습니다."
  es: "Se descarga un modelo de traducción con IA a este Mac. El texto y las traducciones nunca salen de este Mac."
  fr: "Un modèle de traduction par IA est téléchargé sur cet ordinateur Mac. Vos textes et traductions restent sur cet ordinateur Mac."
  de: "Ein KI-Übersetzungsmodell wird auf diesen Mac geladen. Ihre Texte und Übersetzungen bleiben auf diesem Mac."
  pt-BR: "Um modelo de tradução por IA será baixado neste Mac. Seus textos e traduções ficam neste Mac."
  id: "Model AI untuk penerjemahan akan diunduh ke Mac ini. Teks dan terjemahan Anda tetap di Mac ini."
