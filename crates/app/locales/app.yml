files.pdf_layout_fallback:
  en: "The original pages were kept because their text could not be safely replaced."
  ja: "本文を安全に置き換えられないため、元のページを残しました。"
  zh-Hans: "原文无法安全替换，已保留原始页面。"
  zh-Hant: "原文無法安全取代，已保留原始頁面。"
  ko: "텍스트를 안전하게 바꿀 수 없어 원본 페이지를 그대로 유지했습니다."
  es: "Se conservaron las páginas originales porque no se pudo sustituir el texto de forma segura."
  fr: "Les pages d’origine ont été conservées, car leur texte ne pouvait pas être remplacé en toute sécurité."
  de: "Die Originalseiten blieben erhalten, weil sich ihr Text nicht sicher ersetzen ließ."
  pt-BR: "As páginas originais foram mantidas porque o texto não pôde ser substituído com segurança."
  id: "Halaman asli dipertahankan karena teksnya tidak dapat diganti dengan aman."

