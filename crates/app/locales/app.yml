  ja: 表示の大きさ
  zh-Hans: "界面大小"
  zh-Hant: "介面大小"
  ko: "인터페이스 크기"
  es: "Tamaño de interfaz"
  fr: "Taille de l’interface"
  de: "Oberflächengröße"
  pt-BR: "Tamanho da interface"
  id: "Ukuran antarmuka"
settings.ui_scale_note:
  en: "On top of the display scaling of the OS. For a high-DPI display that the desktop does not scale (some Linux desktops)."
  ja: "OS の表示スケールに上乗せします。高解像度のディスプレイを OS が拡大しない場合（一部の Linux デスクトップ）に使ってください。"
  zh-Hans: "在系统缩放的基础上调整。适用于桌面环境不会自动缩放的高分辨率显示器（如部分 Linux 桌面）。"
  zh-Hant: "在系統縮放的基礎上調整。適用於桌面環境不會自動縮放的高解析度顯示器（例如部分 Linux 桌面）。"
  ko: "운영체제의 배율에 추가로 적용됩니다. 일부 Linux 환경처럼 고해상도 화면이 자동으로 확대되지 않을 때 사용하십시오."
  es: "Se añade a la escala del sistema. Útil para pantallas de alta densidad sin escalado de escritorio (algunos entornos Linux)."
  fr: "S’ajoute à la mise à l’échelle du système. Utile sur un écran haute densité sans mise à l’échelle du bureau (certains bureaux Linux)."
  de: "Zusätzlich zur Skalierung des Betriebssystems. Geeignet für hochauflösende Bildschirme ohne Desktop-Skalierung (einige Linux-Desktops)."
  pt-BR: "Complementa a escala do sistema. Útil em telas de alta densidade sem ajuste de escala da área de trabalho (em alguns ambientes Linux)."
  id: "Menambah skala tampilan sistem. Berguna untuk layar berkerapatan tinggi yang tidak diskalakan oleh desktop (sebagian desktop Linux)."
settings.double_copy:
  en: Translate when copied twice
  ja: 2 回コピーで翻訳する
  zh-Hans: "连续复制两次即翻译"
  zh-Hant: "連續複製兩次即翻譯"
  ko: "두 번 복사하여 번역"
  es: "Traducir al copiar dos veces"
  fr: "Traduire après deux copies"
  de: "Beim zweimaligen Kopieren übersetzen"
  pt-BR: "Traduzir ao copiar duas vezes"
  id: "Terjemahkan saat disalin dua kali"
settings.double_copy_note:
  en: "Select text in any application and press Ctrl+C twice quickly (⌘C on macOS): this window comes to the front and translates it. Only the clipboard is watched, not the keyboard. To use this with the window closed, also turn on “Keep running when the window is closed”."
  ja: "どのアプリでも、テキストを選んで Ctrl+C（macOS では ⌘C）を素早く 2 回押すと、このウィンドウが前面に出て翻訳します。見るのはクリップボードだけで、キーボードの入力は見ません。ウィンドウを閉じた後も使うには「ウィンドウを閉じても常駐する」もオンにしてください。"
  zh-Hans: "在任意应用中选中文本，快速按两次 Ctrl+C（macOS 上为 ⌘C），即可将此窗口切到前台并翻译。应用只监视剪贴板，不监视键盘。如需在窗口关闭时使用，请同时启用「关闭窗口后继续运行」。"
  zh-Hant: "在任意 App 選取文字，快速按兩次 Ctrl+C（macOS 為 ⌘C），即可將此視窗移到前景並翻譯。App 只會監看剪貼簿，不會監看鍵盤。若要在視窗關閉時使用，請一併開啟「關閉視窗後繼續執行」。"
  ko: "어느 앱에서든 텍스트를 선택하고 Ctrl+C(macOS에서는 ⌘C)를 빠르게 두 번 누르면 이 창이 앞으로 나오고 번역합니다. 키보드는 감시하지 않고 클립보드만 감시합니다. 창을 닫은 후에도 쓰려면 ‘창을 닫아도 계속 실행’을 켜십시오."
  es: "Seleccionar texto en cualquier aplicación y pulsar dos veces seguidas Ctrl+C (⌘C en macOS). Esta ventana pasa al frente y lo traduce. Solo se supervisa el portapapeles. Para usarlo con la ventana cerrada, activar también «Seguir en ejecución al cerrar la ventana»."
  fr: "Sélectionnez du texte dans une application et appuyez rapidement deux fois sur Ctrl+C (⌘C sous macOS). La fenêtre passe au premier plan et traduit le texte. Seul le presse-papiers est surveillé. Pour utiliser cette fonction fenêtre fermée, activez aussi « Rester actif à la fermeture de la fenêtre »."
  de: "Wählen Sie in einer beliebigen App Text aus und drücken Sie zweimal kurz Strg+C (⌘C unter macOS). Dieses Fenster erscheint und übersetzt den Text. Überwacht wird nur die Zwischenablage. Aktivieren Sie zusätzlich „Nach dem Schließen des Fensters weiterlaufen“, wenn Sie die Funktion auch bei geschlossenem Fenster nutzen möchten."
  pt-BR: "Selecione texto em qualquer aplicativo e pressione Ctrl+C duas vezes rapidamente (⌘C no macOS). Esta janela vai para a frente e traduz o texto. Só a área de transferência é monitorada. Para usar com a janela fechada, ative também “Continuar em execução ao fechar a janela”."
  id: "Pilih teks di aplikasi mana saja dan tekan Ctrl+C (⌘C di macOS) dua kali dengan cepat. Jendela ini maju dan menerjemahkannya. Hanya papan klip yang dipantau. Untuk memakainya saat jendela ditutup, aktifkan juga “Tetap berjalan saat jendela ditutup”."
settings.double_copy_failed:
  en: "Cannot watch the clipboard: %{message}"
  ja: "クリップボードを監視できません: %{message}"
  zh-Hans: "无法监视剪贴板：%{message}"
  zh-Hant: "無法監看剪貼簿：%{message}"
  ko: "클립보드를 감시할 수 없습니다: %{message}"
  es: "No se puede supervisar el portapapeles: %{message}"
  fr: "Impossible de surveiller le presse-papiers : %{message}"
  de: "Zwischenablage kann nicht überwacht werden: %{message}"
  pt-BR: "Não foi possível monitorar a área de transferência: %{message}"
  id: "Tidak dapat memantau papan klip: %{message}"
settings.double_copy_no_x11:
  en: "Not available here: watching the clipboard needs X11 (in a Wayland session, Xwayland), and DISPLAY is not set."
  ja: "この環境では使えません。クリップボードを見るには X11（Wayland のセッションでは Xwayland）が必要ですが、DISPLAY が設定されていません。"
  zh-Hans: "此功能不可用：监视剪贴板需要 X11（Wayland 会话中需要 Xwayland），且未设置 DISPLAY。"
  zh-Hant: "無法使用此功能：監看剪貼簿需要 X11（Wayland 工作階段需要 Xwayland），且尚未設定 DISPLAY。"
  ko: "이 기능은 사용할 수 없습니다. 클립보드 감시에는 X11(Wayland 세션에서는 Xwayland)이 필요하며 DISPLAY가 설정되어 있지 않습니다."
  es: "No disponible. Supervisar el portapapeles requiere X11 (Xwayland en una sesión Wayland) y no se ha configurado DISPLAY."
  fr: "Indisponible. La surveillance du presse-papiers requiert X11 (Xwayland dans une session Wayland) et DISPLAY n’est pas défini."
  de: "Nicht verfügbar. Die Überwachung benötigt X11 (in einer Wayland-Sitzung Xwayland), und DISPLAY ist nicht gesetzt."
  pt-BR: "Indisponível. Monitorar a área de transferência requer X11 (Xwayland em sessões do Wayland) e DISPLAY não está definido."
  id: "Tidak tersedia. Pemantauan papan klip memerlukan X11 (Xwayland dalam sesi Wayland), dan DISPLAY belum diatur."
settings.resident:
  en: Keep running when the window is closed
  ja: ウィンドウを閉じても常駐する
  zh-Hans: "关闭窗口后继续运行"
  zh-Hant: "關閉視窗後繼續執行"
  ko: "창을 닫아도 계속 실행"
  es: "Seguir en ejecución al cerrar la ventana"
  fr: "Rester actif à la fermeture de la fenêtre"
  de: "Nach dem Schließen des Fensters weiterlaufen"
  pt-BR: "Continuar em execução ao fechar a janela"
  id: "Tetap berjalan saat jendela ditutup"
settings.resident_note_windows:
  en: "The icon in the notification area opens the window again, and its menu quits the app (as Ctrl+Q does). The model is released while the window is closed, and loaded again when it opens."
  ja: "通知領域のアイコンでウィンドウを開き直し、そのメニューでアプリを終了します（Ctrl+Q でも終了します）。ウィンドウを閉じている間はモデルをメモリから外し、開くときに読み込み直します。"
  zh-Hans: "可用通知区域图标重新打开窗口，也可通过其菜单或 Ctrl+Q 退出应用。窗口关闭时释放模型，重新打开时再次加载。"
  zh-Hant: "可從通知區域的圖像重新打開視窗，也可透過其選單或 Ctrl+Q 結束 App。關閉視窗時會卸載模型，重新打開時再載入。"
  ko: "알림 영역의 아이콘으로 창을 다시 열 수 있습니다. 아이콘 메뉴 또는 Ctrl+Q로 앱을 종료합니다. 창을 닫으면 모델이 메모리에서 해제되며 다시 열면 모델을 불러옵니다."
  es: "El icono del área de notificación permite volver a abrir la ventana. Su menú o Ctrl+Q cierran la aplicación. Al cerrar la ventana, se libera el modelo y al abrirla se vuelve a cargar."
  fr: "L’icône de la zone de notification rouvre la fenêtre. Son menu permet de quitter l’application, comme Ctrl+Q. Le modèle est libéré à la fermeture et rechargé à la réouverture."
  de: "Das Symbol im Infobereich öffnet das Fenster erneut. Über sein Menü oder Strg+Q beenden Sie die App. Beim Schließen wird das Modell aus dem Speicher entladen und beim Öffnen erneut geladen."
  pt-BR: "O ícone na área de notificação reabre a janela. O menu do ícone ou Ctrl+Q encerra o aplicativo. O modelo é removido da memória ao fechar e recarregado ao reabrir."
  id: "Ikon di area notifikasi membuka kembali jendela. Menunya atau Ctrl+Q menutup aplikasi. Model dikeluarkan dari memori saat jendela ditutup dan dimuat lagi saat dibuka."
settings.resident_note_macos:
  en: "The app's icon in the Dock opens the window again; ⌘Q quits the app. The model is released while the window is closed, and loaded again when it opens."
  ja: "Dock のアイコンでウィンドウを開き直します。⌘Q でアプリを終了します。ウィンドウを閉じている間はモデルをメモリから外し、開くときに読み込み直します。"
  zh-Hans: "点按程序坞中的应用图标可重新打开窗口。按 ⌘Q 退出应用。窗口关闭时释放模型，重新打开时再次加载。"
  zh-Hant: "按一下 Dock 中的 App 圖像可重新打開視窗。按 ⌘Q 結束 App。關閉視窗時會卸載模型，重新打開時再載入。"
  ko: "Dock의 앱 아이콘으로 창을 다시 열 수 있습니다. ⌘Q로 앱을 종료합니다. 창을 닫으면 모델이 메모리에서 해제되며 다시 열면 모델을 불러옵니다."
  es: "El icono de la aplicación en el Dock vuelve a abrir la ventana. ⌘Q cierra la aplicación. Al cerrar la ventana, se libera el modelo y al abrirla se vuelve a cargar."
  fr: "L’icône du Dock rouvre la fenêtre. Appuyez sur ⌘Q pour quitter l’application. Le modèle est libéré à la fermeture et rechargé à la réouverture."
  de: "Das App-Symbol im Dock öffnet das Fenster erneut. Mit ⌘Q beenden Sie die App. Beim Schließen wird das Modell aus dem Speicher entladen und beim Öffnen erneut geladen."
  pt-BR: "O ícone no Dock reabre a janela. Pressione ⌘Q para encerrar o aplicativo. O modelo é removido da memória ao fechar e recarregado ao reabrir."
  id: "Ikon aplikasi di Dock membuka kembali jendela. Tekan ⌘Q untuk menutup aplikasi. Model dikeluarkan dari memori saat jendela ditutup dan dimuat lagi saat dibuka."
settings.resident_note_linux:
  en: "Starting the app again opens the window; Ctrl+Q quits the app. The model is released while the window is closed, and loaded again when it opens."
  ja: "アプリをもう一度起動するとウィンドウが開きます。Ctrl+Q でアプリを終了します。ウィンドウを閉じている間はモデルをメモリから外し、開くときに読み込み直します。"
  zh-Hans: "再次启动应用可打开窗口。按 Ctrl+Q 退出应用。窗口关闭时释放模型，重新打开时再次加载。"
  zh-Hant: "再次啟動 App 可打開視窗。按 Ctrl+Q 結束 App。關閉視窗時會卸載模型，重新打開時再載入。"
  ko: "앱을 다시 시작하면 창이 열립니다. Ctrl+Q로 앱을 종료합니다. 창을 닫으면 모델이 메모리에서 해제되며 다시 열면 모델을 불러옵니다."
  es: "Al volver a iniciar la aplicación se abre la ventana. Ctrl+Q cierra la aplicación. Al cerrar la ventana, se libera el modelo y al abrirla se vuelve a cargar."
  fr: "Relancez l’application pour rouvrir la fenêtre. Appuyez sur Ctrl+Q pour quitter l’application. Le modèle est libéré à la fermeture et rechargé à la réouverture."
  de: "Starten Sie die App erneut, um das Fenster wieder zu öffnen. Mit Strg+Q beenden Sie die App. Beim Schließen wird das Modell aus dem Speicher entladen und beim Öffnen erneut geladen."
  pt-BR: "Inicie o aplicativo novamente para reabrir a janela. Pressione Ctrl+Q para encerrar o aplicativo. O modelo é removido da memória ao fechar e recarregado ao reabrir."
  id: "Jalankan lagi aplikasi untuk membuka jendela. Tekan Ctrl+Q untuk menutup aplikasi. Model dikeluarkan dari memori saat jendela ditutup dan dimuat lagi saat dibuka."
