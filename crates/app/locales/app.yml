  ja: "このファイルを Hy-MT2 7B で翻訳するにはメモリが足りません。モデルの選択を「自動」にするか、小さいモデルを選んでください。"
  zh-Hans: "内存不足，无法使用 Hy-MT2 7B 翻译此文件。请切换到自动选择，或选择更小的模型。"
  zh-Hant: "記憶體不足，無法使用 Hy-MT2 7B 翻譯此檔案。請切換為自動選擇，或選擇較小的模型。"
  ko: "메모리가 부족해 Hy-MT2 7B로 이 파일을 번역할 수 없습니다. 자동으로 전환하거나 더 작은 모델을 선택하세요."
  es: "No hay memoria suficiente para usar Hy-MT2 7B con este archivo. Cambia a Automático o elige un modelo más pequeño."
  fr: "La mémoire est insuffisante pour utiliser Hy-MT2 7B sur ce fichier. Passez en mode Auto ou choisissez un modèle plus petit."
  de: "Für Hy-MT2 7B ist bei dieser Datei nicht genug Arbeitsspeicher verfügbar. Wechseln Sie zu Automatisch oder wählen Sie ein kleineres Modell."
  pt-BR: "Não há memória suficiente para usar o Hy-MT2 7B neste arquivo. Mude para Automático ou escolha um modelo menor."
  id: "Memori tidak cukup untuk memakai Hy-MT2 7B pada file ini. Beralihlah ke Otomatis atau pilih model yang lebih kecil."

files.hy_direction:
  en: "Hy-MT2 does not support this language pair. Choose another target, or use PLaMo if it supports the pair."
  ja: "Hy-MT2 はこの言語の組み合わせに対応していません。訳先を変えるか、対応する場合は PLaMo を使ってください。"
  zh-Hans: "Hy-MT2 不支持此语言组合。请选择其他目标语言，或在 PLaMo 支持此组合时使用 PLaMo。"
  zh-Hant: "Hy-MT2 不支援此語言組合。請改選目標語言，或在 PLaMo 支援此組合時使用 PLaMo。"
  ko: "Hy-MT2는 이 언어 조합을 지원하지 않습니다. 대상 언어를 바꾸거나, 이 조합을 지원하는 경우 PLaMo를 사용하세요."
  es: "Hy-MT2 no admite este par de idiomas. Elige otro idioma de destino o usa PLaMo si admite el par."
  fr: "Hy-MT2 ne prend pas en charge cette paire de langues. Choisissez une autre langue cible ou utilisez PLaMo s’il prend en charge cette paire."
  de: "Hy-MT2 unterstützt dieses Sprachpaar nicht. Wählen Sie eine andere Zielsprache oder verwenden Sie PLaMo, wenn es das Paar unterstützt."
  pt-BR: "O Hy-MT2 não oferece suporte a esse par de idiomas. Escolha outro idioma de destino ou use o PLaMo se ele oferecer suporte ao par."
  id: "Hy-MT2 tidak mendukung pasangan bahasa ini. Pilih bahasa tujuan lain, atau gunakan PLaMo jika mendukung pasangan ini."

files.index_direction:
  en: "Index-Translate does not support this language pair. Choose another target or switch to Auto."
  ja: "Index-Translate はこの言語の組み合わせに対応していません。訳先を変えるか、モデルを自動選択に切り替えてください。"
  zh-Hans: "Index-Translate 不支持此语言组合。请选择其他目标语言或切换到自动选择。"
  zh-Hant: "Index-Translate 不支援此語言組合。請選擇其他目標語言或切換到自動選擇。"
  ko: "Index-Translate는 이 언어 조합을 지원하지 않습니다. 대상 언어를 바꾸거나 자동 선택으로 전환하세요."
  es: "Index-Translate no admite este par de idiomas. Elige otro idioma de destino o cambia a Automático."
  fr: "Index-Translate ne prend pas en charge cette paire de langues. Choisissez une autre langue cible ou passez en mode Auto."
  de: "Index-Translate unterstützt dieses Sprachpaar nicht. Wählen Sie eine andere Zielsprache oder wechseln Sie zu Automatisch."
  pt-BR: "O Index-Translate não oferece suporte a esse par de idiomas. Escolha outro idioma de destino ou mude para Automático."
  id: "Index-Translate tidak mendukung pasangan bahasa ini. Pilih bahasa tujuan lain atau beralih ke Otomatis."

files.index_markdown_context:
  en: "Index-Translate can translate Markdown only without context or a glossary. Clear both fields or switch to Auto."
  ja: "Index-Translate で Markdown を翻訳するには、文脈と用語集を空にしてください。文脈や用語集を使う場合は、モデルを自動選択に切り替えてください。"
  zh-Hans: "Index-Translate 仅在没有上下文和术语表时可以翻译 Markdown。请清空这两个字段，或切换到自动选择。"
  zh-Hant: "Index-Translate 只有在未設定語境和詞彙表時才能翻譯 Markdown。請清空這兩個欄位，或切換到自動選擇。"
  ko: "Index-Translate로 Markdown을 번역하려면 문맥과 용어집을 비워야 합니다. 두 항목을 모두 비우거나 자동 선택으로 전환하세요."
  es: "Index-Translate solo puede traducir Markdown sin contexto ni glosario. Vacía ambos campos o cambia a Automático."
  fr: "Index-Translate peut traduire Markdown uniquement sans contexte ni glossaire. Videz les deux champs ou passez en mode Auto."
  de: "Index-Translate kann Markdown nur ohne Kontext und Glossar übersetzen. Leeren Sie beide Felder oder wechseln Sie zu Automatisch."
  pt-BR: "O Index-Translate só pode traduzir Markdown sem contexto nem glossário. Limpe os dois campos ou mude para Automático."
  id: "Index-Translate hanya dapat menerjemahkan Markdown tanpa konteks atau glosarium. Kosongkan kedua kolom atau beralih ke Otomatis."

files.index_markdown_context_auto:
  en: "Index-Translate can translate Markdown only without context or a glossary. Clear both fields or prepare another model for this file."
  ja: "Index-Translate で Markdown を翻訳するには、文脈と用語集を空にしてください。文脈や用語集を使う場合は、このファイルに対応する別のモデルを準備してください。"
  zh-Hans: "Index-Translate 只能在没有上下文和术语表时翻译 Markdown。请清空这两个字段，或为此文件准备其他模型。"
  zh-Hant: "Index-Translate 只能在未設定語境和詞彙表時翻譯 Markdown。請清空這兩個欄位，或為此檔案準備其他模型。"
  ko: "Index-Translate로 Markdown을 번역하려면 문맥과 용어집을 비워야 합니다. 두 항목을 모두 비우거나 이 파일을 지원하는 다른 모델을 준비하세요."
  es: "Index-Translate solo puede traducir Markdown sin contexto ni glosario. Vacía ambos campos o prepara otro modelo compatible con este archivo."
  fr: "Index-Translate peut traduire Markdown uniquement sans contexte ni glossaire. Videz les deux champs ou préparez un autre modèle compatible avec ce fichier."
  de: "Index-Translate kann Markdown nur ohne Kontext und Glossar übersetzen. Leeren Sie beide Felder oder bereiten Sie ein anderes Modell für diese Datei vor."
  pt-BR: "O Index-Translate só pode traduzir Markdown sem contexto nem glossário. Limpe os dois campos ou prepare outro modelo compatível com este arquivo."
  id: "Index-Translate hanya dapat menerjemahkan Markdown tanpa konteks atau glosarium. Kosongkan kedua kolom atau siapkan model lain yang mendukung file ini."

files.hy_source_unknown:
  en: "The document language could not be detected. Choose the source language in the toolbar."
  ja: "文書の言語を検出できませんでした。ツールバーで原言語を選んでください。"
  zh-Hans: "未能检测到文档语言。请在工具栏中选择源语言。"
  zh-Hant: "無法偵測文件語言。請在工具列選擇來源語言。"
  ko: "문서 언어를 감지하지 못했습니다. 도구 모음에서 원본 언어를 선택하세요."
  es: "No se pudo detectar el idioma del documento. Elige el idioma de origen en la barra de herramientas."
  fr: "La langue du document n’a pas pu être détectée. Choisissez la langue source dans la barre d’outils."
  de: "Die Dokumentsprache konnte nicht erkannt werden. Wählen Sie die Ausgangssprache in der Symbolleiste."
  pt-BR: "Não foi possível detectar o idioma do documento. Escolha o idioma de origem na barra de ferramentas."
  id: "Bahasa dokumen tidak dapat dideteksi. Pilih bahasa sumber di bilah alat."

files.file_model_required:
  en: "Prepare a model for this file and try again."
  ja: "このファイルに対応するモデルを準備して、再試行してください。"
  zh-Hans: "请准备支持此文件的模型，然后重试。"
  zh-Hant: "請準備支援此檔案的模型，再試一次。"
  ko: "이 파일을 지원하는 모델을 준비한 뒤 다시 시도하세요."
  es: "Prepara un modelo compatible con este archivo y vuelve a intentarlo."
  fr: "Préparez un modèle compatible avec ce fichier, puis réessayez."
  de: "Bereiten Sie ein Modell für diese Datei vor und versuchen Sie es erneut."
  pt-BR: "Prepare um modelo compatível com este arquivo e tente novamente."
  id: "Siapkan model yang mendukung file ini, lalu coba lagi."


