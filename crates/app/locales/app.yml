  en: "Reading or saving file…"
  ja: "ファイルを読み込み・保存しています…"
  zh-Hans: "正在读取或保存文件…"
  zh-Hant: "正在讀取或儲存檔案…"
  ko: "파일을 읽거나 저장하는 중…"
  es: "Leyendo o guardando archivo…"
  fr: "Lecture ou enregistrement du fichier…"
  de: "Datei wird gelesen oder gespeichert…"
  pt-BR: "Lendo ou salvando arquivo…"
