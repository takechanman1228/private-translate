files.pdf_running_consolidated:
  en: "Translations of %{count} repeated heading paragraphs were consolidated on additional pages at their first occurrence."
  ja: "繰り返す見出し%{count}段落の訳文は、最初に現れたページの追加ページにまとめました。"
  zh-Hans: "已将 %{count} 段重复标题的译文汇总到首次出现位置的附加页。"
  zh-Hant: "已將 %{count} 段重複標題的譯文集中到第一次出現位置的補充頁。"
  ko: "반복되는 제목 문단 %{count}개의 번역을 처음 나온 위치의 추가 페이지에 모았습니다."
  es: "Se agruparon las traducciones correspondientes a %{count} párrafos de encabezados repetidos en páginas añadidas junto a su primera aparición."
  fr: "Les traductions de %{count} paragraphes de titres répétés ont été regroupées sur des pages supplémentaires à leur première occurrence."
  de: "Die Übersetzungen von %{count} wiederkehrenden Überschriften wurden beim ersten Vorkommen auf Zusatzseiten zusammengefasst."
  pt-BR: "As traduções de %{count} parágrafos de títulos repetidos foram reunidas em páginas adicionais na primeira ocorrência."
  id: "Terjemahan dari %{count} paragraf judul berulang dihimpun di halaman tambahan pada kemunculan pertamanya."

