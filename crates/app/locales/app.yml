  ja: "ファイルを処理しています"
  zh-Hans: "正在处理文件"
  zh-Hant: "正在處理檔案"
  ko: "파일 작업 진행 중"
  es: "Hay una operación de archivo en curso"
  fr: "Opération sur un fichier en cours"
  de: "Dateivorgang läuft"
  pt-BR: "Operação de arquivo em andamento"
  id: "Operasi file sedang berlangsung"

files.close_body:
  en: "Keep the window open to continue, or stop and close it. Unsaved translations will be discarded."
  ja: "続行する場合はウィンドウを開いたままにします。中止して閉じると、未保存の訳文は破棄されます。"
  zh-Hans: "要继续，请保持窗口打开；也可停止并关闭。未保存的译文将被丢弃。"
  zh-Hant: "若要繼續，請保持視窗開啟。也可以停止並關閉視窗，未儲存的譯文將會捨棄。"
  ko: "계속하려면 창을 열어 두십시오. 작업을 중지하고 닫으면 저장하지 않은 번역문은 삭제됩니다."
  es: "Dejar la ventana abierta para continuar o detener la operación y cerrarla. Se descartarán las traducciones sin guardar."
  fr: "Laissez la fenêtre ouverte pour continuer, ou arrêtez l’opération et fermez-la. Les traductions non enregistrées seront perdues."
  de: "Lassen Sie das Fenster offen, um fortzufahren, oder stoppen Sie den Vorgang und schließen Sie es. Nicht gespeicherte Übersetzungen gehen verloren."
