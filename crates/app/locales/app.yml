files.babeldoc_choose_source:
  en: "For papers, choose the source language if the PDF is not in Japanese."
  ja: "論文向けの出力では、日本語以外の PDF の原言語を選んでください。"
  zh-Hans: "使用论文格式时，若 PDF 不是日语，请选择源语言。"
  zh-Hant: "使用論文格式時，若 PDF 不是日文，請選擇來源語言。"
  ko: "논문용 형식에서 일본어 PDF가 아닐 경우 원본 언어를 선택하십시오."
  es: "En el formato para artículos, elegir el idioma de origen si el PDF no está en japonés."
  fr: "Pour les articles, sélectionnez la langue source si le PDF n’est pas en japonais."
  de: "Wählen Sie bei Fachartikeln die Ausgangssprache, wenn die PDF-Datei nicht auf Japanisch ist."
  pt-BR: "Para artigos, escolha o idioma de origem se o PDF não estiver em japonês."
  id: "Untuk artikel ilmiah, pilih bahasa sumber jika PDF bukan dalam bahasa Jepang."

files.babeldoc_choose_source_batch:
  en: "Choose the PDF’s source language before starting the batch. Other files use detection."
  ja: "一括翻訳を始める前に PDF の原言語を選んでください。ほかのファイルは自動で検出します。"
  zh-Hans: "开始批量翻译前，请选择 PDF 的源语言。其他文件会自动检测。"
  zh-Hant: "開始批次翻譯前，請選擇 PDF 的來源語言。其他檔案會自動偵測。"
  ko: "일괄 번역을 시작하기 전에 PDF의 원본 언어를 선택하십시오. 다른 파일의 언어는 자동으로 감지됩니다."
  es: "Antes de iniciar el lote, elegir el idioma de origen del PDF. En los demás archivos se detecta automáticamente."
  fr: "Sélectionnez la langue source du PDF avant de démarrer le lot. La langue des autres fichiers sera détectée automatiquement."
  de: "Wählen Sie vor dem Start des Stapels die Ausgangssprache der PDF-Datei. Bei anderen Dateien wird sie automatisch erkannt."
  pt-BR: "Escolha o idioma de origem do PDF antes de iniciar o lote. Nos outros arquivos, o idioma é detectado automaticamente."
  id: "Pilih bahasa sumber PDF sebelum mulai menerjemahkan beberapa file. Bahasa file lain dideteksi otomatis."

files.babeldoc_engine_gone:
  en: "The BabelDOC engine could not be started: it was moved or can no longer be run. Check it in Settings."
  ja: "BabelDOC のエンジンを起動できませんでした。移動されたか、実行できなくなっています。設定で確認してください。"
  zh-Hans: "无法启动 BabelDOC 引擎：文件已移动或无法运行。请在「设置」中检查。"
  zh-Hant: "無法啟動 BabelDOC 引擎：檔案已移動或無法執行。請到「設定」檢查。"
  ko: "BabelDOC 엔진을 시작할 수 없습니다. 파일이 이동되었거나 실행할 수 없습니다. 설정에서 확인하십시오."
  es: "No se pudo iniciar el motor BabelDOC: se movió o ya no se puede ejecutar. Revisarlo en Configuración."
  fr: "Impossible de démarrer le moteur BabelDOC. Il a été déplacé ou ne peut plus être exécuté. Vérifiez-le dans Paramètres."
  de: "Die BabelDOC-Engine wurde verschoben oder ist nicht mehr ausführbar. Prüfen Sie die Einstellungen."
  pt-BR: "Não foi possível iniciar o mecanismo BabelDOC. Ele foi movido ou não pode mais ser executado. Confira em Configurações."
  id: "Mesin BabelDOC tidak dapat dijalankan karena dipindahkan atau tidak lagi dapat dieksekusi. Periksa di Pengaturan."

files.babeldoc_assets_missing:
  en: "BabelDOC's offline components are missing. Restore them with babeldoc-engine (assets restore), then try again."
  ja: "BabelDOC の部品が足りません。babeldoc-engine（assets restore）で戻してから、もう一度翻訳してください。"
  zh-Hans: "缺少 BabelDOC 离线组件。请运行 babeldoc-engine (assets restore) 恢复组件，然后重试。"
  zh-Hant: "缺少 BabelDOC 離線元件。請執行 babeldoc-engine (assets restore) 回復元件，再試一次。"
  ko: "BabelDOC 오프라인 구성 요소가 없습니다. babeldoc-engine (assets restore)으로 복구한 후 다시 시도하십시오."
  es: "Faltan componentes sin conexión de BabelDOC. Restaurarlos con babeldoc-engine (assets restore) y volver a intentar."
  fr: "Les composants hors ligne de BabelDOC sont manquants. Restaurez-les avec babeldoc-engine (assets restore), puis réessayez."
  de: "Offline-Komponenten von BabelDOC fehlen. Stellen Sie sie mit babeldoc-engine (assets restore) wieder her und versuchen Sie es erneut."
  pt-BR: "Faltam componentes offline do BabelDOC. Restaure-os com babeldoc-engine (assets restore) e tente de novo."
  id: "Komponen offline BabelDOC tidak tersedia. Pulihkan dengan babeldoc-engine (assets restore), lalu coba lagi."

files.babeldoc_scanned:
  en: "BabelDOC judged this PDF to be a scan. Use a PDF with a text layer, or the other outputs."
  ja: "BabelDOC はこの PDF をスキャンした文書と判断しました。文字の入った PDF を使うか、ほかの出力を選んでください。"
  zh-Hans: "BabelDOC 判定此 PDF 是扫描件。请使用带文本层的 PDF，或选择其他输出格式。"
  zh-Hant: "BabelDOC 判定這份 PDF 是掃描檔。請使用具有文字圖層的 PDF，或選擇其他輸出格式。"
  ko: "BabelDOC에서 스캔된 PDF로 판단했습니다. 텍스트 레이어가 있는 PDF를 사용하거나 다른 출력 형식을 선택하십시오."
  es: "BabelDOC detectó que este PDF es un escaneo. Usar un PDF con capa de texto u otro formato de salida."
  fr: "BabelDOC a reconnu un PDF numérisé. Utilisez un PDF avec une couche de texte ou choisissez une autre sortie."
  de: "BabelDOC hat diese PDF-Datei als Scan erkannt. Verwenden Sie eine PDF-Datei mit Textebene oder wählen Sie ein anderes Ausgabeformat."
  pt-BR: "O BabelDOC identificou este PDF como digitalização. Use um PDF com camada de texto ou escolha outra saída."
  id: "BabelDOC mendeteksi PDF ini sebagai pindaian. Gunakan PDF dengan lapisan teks atau pilih keluaran lain."

files.babeldoc_already_translated:
  en: "This PDF is already a BabelDOC translation. Choose the original."
  ja: "この PDF は BabelDOC の訳文です。原本を選んでください。"
  zh-Hans: "此 PDF 已由 BabelDOC 翻译。请选择原文件。"
  zh-Hant: "這份 PDF 已由 BabelDOC 翻譯。請選擇原始檔案。"
  ko: "이미 BabelDOC로 번역된 PDF입니다. 원본을 선택하십시오."
  es: "Este PDF ya está traducido con BabelDOC. Elegir el original."
  fr: "Ce PDF a déjà été traduit avec BabelDOC. Choisissez l’original."
  de: "Diese PDF-Datei wurde bereits mit BabelDOC übersetzt. Wählen Sie das Original."
  pt-BR: "Este PDF já foi traduzido pelo BabelDOC. Escolha o original."
  id: "PDF ini sudah diterjemahkan oleh BabelDOC. Pilih file asli."

files.babeldoc_unreadable:
  en: "BabelDOC could not read this PDF. Try the other outputs."
  ja: "BabelDOC はこの PDF を読めませんでした。ほかの出力を試してください。"
  zh-Hans: "BabelDOC 无法读取此 PDF。请尝试其他输出格式。"
  zh-Hant: "BabelDOC 無法讀取這份 PDF。請試用其他輸出格式。"
  ko: "BabelDOC에서 이 PDF를 읽을 수 없습니다. 다른 출력 형식을 사용해 보십시오."
  es: "BabelDOC no pudo leer este PDF. Probar otro formato de salida."
  fr: "BabelDOC n’a pas pu lire ce PDF. Essayez une autre sortie."
  de: "BabelDOC konnte diese PDF-Datei nicht lesen. Versuchen Sie ein anderes Ausgabeformat."
  pt-BR: "O BabelDOC não conseguiu ler este PDF. Tente outra saída."
  id: "BabelDOC tidak dapat membaca PDF ini. Coba keluaran lain."

files.babeldoc_failed:
  en: "BabelDOC could not translate this PDF. No output was saved. Try again, or choose another PDF output."
  ja: "BabelDOC でこの PDF を訳せませんでした。出力は保存していません。もう一度試すか、ほかの PDF の出力を選んでください。"
  zh-Hans: "BabelDOC 无法翻译此 PDF，未保存输出文件。请重试或选择其他输出格式。"
  zh-Hant: "BabelDOC 無法翻譯這份 PDF，未儲存輸出檔案。請再試一次或選擇其他輸出格式。"
  ko: "BabelDOC에서 이 PDF를 번역하지 못했습니다. 출력 파일은 저장되지 않았습니다. 다시 시도하거나 다른 출력 형식을 선택하십시오."
  es: "BabelDOC no pudo traducir este PDF. No se guardó ningún archivo. Volver a intentar o elegir otro formato de salida."
  fr: "BabelDOC n’a pas pu traduire ce PDF. Aucun fichier n’a été enregistré. Réessayez ou choisissez une autre sortie."
  de: "BabelDOC konnte diese PDF-Datei nicht übersetzen. Es wurde keine Ausgabedatei gespeichert. Versuchen Sie es erneut oder wählen Sie ein anderes Ausgabeformat."
  pt-BR: "O BabelDOC não conseguiu traduzir este PDF. Nenhum arquivo de saída foi salvo. Tente novamente ou escolha outra saída."
  id: "BabelDOC tidak dapat menerjemahkan PDF ini. Tidak ada file keluaran yang disimpan. Coba lagi atau pilih keluaran lain."

files.pdf_format_note:
  en: "Changing the format requires translating again."
  ja: "形式を変えるには訳し直してください。"
  zh-Hans: "更改格式需要重新翻译。"
  zh-Hant: "變更格式後須重新翻譯。"
  ko: "형식을 변경하려면 다시 번역해야 합니다."
  es: "Cambiar el formato requiere volver a traducir."
  fr: "Changer de format nécessite de retraduire."
  de: "Bei einem Formatwechsel muss erneut übersetzt werden."
  pt-BR: "Alterar o formato exige uma nova tradução."
  id: "Mengubah format memerlukan penerjemahan ulang."

files.pdf_choose_format_again:
  en: "Choose a format for retranslation"
  ja: "形式を選び直す"
  zh-Hans: "选择重新翻译的格式"
  zh-Hant: "選擇重新翻譯的格式"
  ko: "다시 번역할 형식 선택"
  es: "Elegir formato para volver a traducir"
  fr: "Choisir un format pour retraduire"
  de: "Format für erneute Übersetzung wählen"
  pt-BR: "Escolher formato para traduzir novamente"
  id: "Pilih format untuk penerjemahan ulang"

files.pdf_layout_saved:
  en: "Preserved the layout on %{layout} of %{total} source pages."
  ja: "%{total}ページ中%{layout}ページで元のレイアウトを保ちました。"
  zh-Hans: "共 %{total} 页，保留了 %{layout} 页的原始布局。"
  zh-Hant: "共 %{total} 頁，保留了 %{layout} 頁的原始版面。"
  ko: "원본 %{total}페이지 중 %{layout}페이지에서 레이아웃을 유지했습니다."
  es: "Se conservó el diseño en %{layout} de %{total} páginas del original."
  fr: "Mise en page conservée sur %{layout} pages source sur %{total}."
  de: "Bei %{layout} von %{total} Originalseiten blieb das Layout erhalten."
  pt-BR: "Layout preservado em %{layout} de %{total} páginas originais."
  id: "Tata letak dipertahankan pada %{layout} dari %{total} halaman sumber."

files.pdf_supplement_saved:
  en: "Added %{count} supplementary translation pages."
  ja: "補足ページを%{count}ページ追加しました。"
  zh-Hans: "已添加 %{count} 页补充译文。"
  zh-Hant: "已新增 %{count} 頁補充譯文。"
  ko: "보충 번역 %{count}페이지를 추가했습니다."
  es: "Páginas de traducción complementaria añadidas: %{count}."
  fr: "Pages de traduction supplémentaires ajoutées : %{count}."
  de: "%{count} zusätzliche Übersetzungsseiten hinzugefügt."
  pt-BR: "Páginas complementares de tradução adicionadas: %{count}."
  id: "Halaman terjemahan tambahan: %{count}."

files.pdf_supplement_saved_one:
  en: "Added %{count} supplementary translation page."
  ja: "補足ページを%{count}ページ追加しました。"
  zh-Hans: "已添加 %{count} 页补充译文。"
  zh-Hant: "已新增 %{count} 頁補充譯文。"
  ko: "보충 번역 %{count}페이지를 추가했습니다."
  es: "Se añadió %{count} página de traducción complementaria."
  fr: "%{count} page de traduction supplémentaire ajoutée."
  de: "%{count} zusätzliche Übersetzungsseite hinzugefügt."
  pt-BR: "%{count} página complementar de tradução adicionada."
  id: "Halaman terjemahan tambahan: %{count}."

files.pdf_library:
  en: "The PDF runtime could not be loaded. Use the PDF-enabled app."
  ja: "PDFの処理機能を読み込めません。PDF対応の配布版を使用してください。"
  zh-Hans: "无法加载 PDF 运行库。请使用支持 PDF 的应用版本。"
  zh-Hant: "無法載入 PDF 執行階段。請使用支援 PDF 的 App 版本。"
  ko: "PDF 런타임을 불러올 수 없습니다. PDF를 지원하는 앱 버전을 사용하십시오."
  es: "No se pudo cargar el componente PDF. Usar una versión de la aplicación compatible con PDF."
  fr: "Impossible de charger le composant PDF. Utilisez une version de l’application compatible PDF."
  de: "Die PDF-Laufzeit konnte nicht geladen werden. Verwenden Sie die App-Version mit PDF-Unterstützung."
  pt-BR: "Não foi possível carregar o componente de PDF. Use a versão do aplicativo com suporte a PDF."
  id: "Komponen PDF tidak dapat dimuat. Gunakan versi aplikasi yang mendukung PDF."

files.pdf_font:
  en: "The PDF font is missing or cannot display part of the translation. Check the bundled fonts."
  ja: "PDF用フォントが見つからないか、訳文の一部の文字を表示できません。同梱フォントを確認してください。"
  zh-Hans: "缺少 PDF 字体或字体无法显示部分译文。请检查随应用附带的字体。"
  zh-Hant: "缺少 PDF 字型，或字型無法顯示部分譯文。請檢查隨附的字型。"
  ko: "PDF 글꼴이 없거나 번역문의 일부를 표시할 수 없습니다. 앱에 포함된 글꼴을 확인하십시오."
  es: "Falta la fuente para PDF o no muestra parte de la traducción. Revisar las fuentes incluidas."
  fr: "La police PDF est manquante ou ne peut pas afficher une partie de la traduction. Vérifiez les polices fournies."
  de: "Die PDF-Schrift fehlt oder kann einen Teil der Übersetzung nicht anzeigen. Prüfen Sie die mitgelieferten Schriften."
  pt-BR: "A fonte do PDF está ausente ou não exibe parte da tradução. Confira as fontes incluídas."
  id: "Font PDF tidak tersedia atau tidak dapat menampilkan sebagian terjemahan. Periksa font bawaan."

files.pdf_limit:
  en: "PDF limits are 100 pages and 32 MiB. Text limits also apply. Split the PDF into smaller files and try again."
  ja: "PDF の上限は100ページ・32 MiBです。文字数にも上限があります。PDF を小さく分割して訳してください。"
  zh-Hans: "PDF 上限为 100 页和 32 MiB，另有文本长度限制。请拆分 PDF 后重试。"
  zh-Hant: "PDF 上限為 100 頁及 32 MiB，另有文字長度限制。請分割 PDF 後再試一次。"
  ko: "PDF는 100페이지 및 32MiB까지 지원합니다. 텍스트 길이 제한도 적용됩니다. PDF를 나눈 후 다시 시도하십시오."
  es: "Los PDF admiten hasta 100 páginas y 32 MiB. También hay límites de texto. Dividir el PDF y volver a intentar."
  fr: "Limites des PDF : 100 pages et 32 Mio. Les limites de texte s’appliquent aussi. Scindez le PDF et réessayez."
  de: "PDF-Dateien dürfen bis zu 100 Seiten und 32 MiB groß sein. Auch Textlimits gelten. Teilen Sie die PDF-Datei und versuchen Sie es erneut."
  pt-BR: "O limite para PDF é de 100 páginas e 32 MiB. Os limites de texto também se aplicam. Divida o PDF e tente novamente."
  id: "Batas PDF adalah 100 halaman dan 32 MiB. Batas teks juga berlaku. Bagi PDF menjadi file lebih kecil, lalu coba lagi."

files.pdf_interactive:
  en: "We could not verify that this PDF is free of signatures and form fields. Choose an unsigned copy with no form fields."
  ja: "このPDFに署名や入力欄がないことを確認できません。署名も入力欄もないコピーを選んでください。"
  zh-Hans: "无法确认此 PDF 是否没有签名和表单字段。请选择不含签名和表单字段的副本。"
  zh-Hant: "無法確認這份 PDF 是否沒有簽名及表單欄位。請選擇未簽名且無表單欄位的副本。"
  ko: "이 PDF에 서명이나 양식 필드가 없는지 확인할 수 없습니다. 서명과 양식 필드가 없는 복사본을 선택하십시오."
  es: "No se pudo confirmar que el PDF no tenga firmas ni campos de formulario. Elegir una copia sin firmas ni campos."
  fr: "Impossible de vérifier l’absence de signatures et de champs de formulaire. Choisissez une copie non signée et sans champs."
  de: "Es ließ sich nicht prüfen, ob die PDF-Datei frei von Signaturen und Formularfeldern ist. Wählen Sie eine unsignierte Kopie ohne Formularfelder."
  pt-BR: "Não foi possível confirmar se o PDF está livre de assinaturas e campos de formulário. Escolha uma cópia sem assinaturas nem campos."
  id: "Tidak dapat memastikan PDF bebas dari tanda tangan dan kolom formulir. Pilih salinan tanpa tanda tangan dan kolom formulir."

files.original_destination:
  en: "Choose a different filename to preserve the original."
  ja: "原本を残すため、別のファイル名で保存してください。"
  zh-Hans: "请选择其他文件名，以保留原文件。"
  zh-Hant: "請使用其他檔名以保留原始檔案。"
  ko: "원본을 보존하려면 다른 파일 이름을 선택하십시오."
  es: "Elegir otro nombre de archivo para conservar el original."
  fr: "Choisissez un autre nom de fichier pour conserver l’original."
  de: "Wählen Sie einen anderen Dateinamen, um das Original zu behalten."
  pt-BR: "Escolha outro nome de arquivo para preservar o original."
  id: "Pilih nama file lain agar file asli tetap tersimpan."

files.destination_exists:
  en: "That filename already exists. Choose a new filename."
  ja: "同じ名前のファイルがあります。別のファイル名を選んでください。"
  zh-Hans: "文件名已存在。请选择其他名称。"
  zh-Hant: "檔名已存在。請選擇其他名稱。"
  ko: "이미 있는 파일 이름입니다. 새 이름을 선택하십시오."
  es: "Ya existe un archivo con ese nombre. Elegir otro nombre."
  fr: "Ce nom de fichier existe déjà. Choisissez-en un autre."
  de: "Dieser Dateiname existiert bereits. Wählen Sie einen anderen Namen."
  pt-BR: "Esse nome de arquivo já existe. Escolha outro nome."
  id: "Nama file sudah ada. Pilih nama baru."

files.unsupported:
  en: "This file format is unsupported. Choose .txt, .md, .docx, .pptx or .pdf. For spreadsheets and older Office files, export to PDF or save in a supported format first."
  ja: "この形式には対応していません。.txt・.md・.docx・.pptx・.pdf を選んでください。.xlsx・.doc・.ppt などは、PDF または対応する新しい形式に書き出すと訳せます。"
  zh-Hans: "不支持此文件格式。请选择 .txt、.md、.docx、.pptx 或 .pdf。对于电子表格和旧版 Office 文件，请先导出为 PDF 或保存为受支持的格式。"
  zh-Hant: "不支援此檔案格式。請選擇 .txt、.md、.docx、.pptx 或 .pdf。試算表和舊版 Office 檔案請先輸出為 PDF，或另存為支援的格式。"
  ko: "지원되지 않는 파일 형식입니다. .txt, .md, .docx, .pptx 또는 .pdf를 선택하십시오. 스프레드시트나 이전 Office 파일은 먼저 PDF로 내보내거나 지원되는 형식으로 저장하십시오."
  es: "Formato incompatible. Elegir .txt, .md, .docx, .pptx o .pdf. Para hojas de cálculo y archivos de Office antiguos, exportar a PDF o guardar primero en un formato compatible."
  fr: "Format de fichier non pris en charge. Choisissez .txt, .md, .docx, .pptx ou .pdf. Pour un tableur ou un ancien format Office, exportez en PDF ou enregistrez dans un format compatible."
  de: "Dateiformat wird nicht unterstützt. Wählen Sie .txt, .md, .docx, .pptx oder .pdf. Exportieren Sie Tabellen und ältere Office-Dateien als PDF oder speichern Sie sie zuerst in einem unterstützten Format."
  pt-BR: "Formato de arquivo não compatível. Escolha .txt, .md, .docx, .pptx ou .pdf. Para planilhas e arquivos antigos do Office, exporte para PDF ou salve primeiro em um formato compatível."
  id: "Format file tidak didukung. Pilih .txt, .md, .docx, .pptx, atau .pdf. Untuk spreadsheet dan file Office lama, ekspor ke PDF atau simpan ke format yang didukung terlebih dahulu."

files.too_large:
  en: "TXT and Markdown files can be up to 4 MiB. Split the file and translate each part."
  ja: "TXT・Markdown の上限は4 MiBです。ファイルを分割して訳してください。"
  zh-Hans: "TXT 和 Markdown 文件的上限为 4 MiB。请拆分文件并逐个翻译。"
  zh-Hant: "TXT 與 Markdown 檔案上限為 4 MiB。請分割檔案後逐一翻譯。"
  ko: "TXT 및 Markdown 파일은 최대 4MiB까지 지원합니다. 파일을 나누어 각 부분을 번역하십시오."
  es: "Los archivos TXT y Markdown admiten hasta 4 MiB. Dividir el archivo y traducir cada parte."
  fr: "Les fichiers TXT et Markdown sont limités à 4 Mio. Scindez le fichier, puis traduisez chaque partie."
  de: "TXT- und Markdown-Dateien dürfen bis zu 4 MiB groß sein. Teilen Sie die Datei und übersetzen Sie die Teile einzeln."
  pt-BR: "Arquivos TXT e Markdown podem ter até 4 MiB. Divida o arquivo e traduza cada parte."
  id: "File TXT dan Markdown dibatasi hingga 4 MiB. Bagi file, lalu terjemahkan tiap bagian."

files.bad_encoding:
  en: "The text uses an unreadable encoding or contains control characters. Save a copy as UTF-8 and remove control characters such as form feeds."
  ja: "文字コードまたは制御文字のため本文を読み取れません。コピーを UTF-8 で保存し、改ページなどの制御文字を取り除いてください。"
  zh-Hans: "文本使用无法读取的编码或包含控制字符。请将副本保存为 UTF-8，并移除换页符等控制字符。"
  zh-Hant: "文字採用無法讀取的編碼或包含控制字元。請將副本儲存為 UTF-8，並移除換頁等控制字元。"
  ko: "읽을 수 없는 인코딩이거나 제어 문자가 들어 있습니다. 복사본을 UTF-8로 저장하고 페이지 나누기 등의 제어 문자를 제거하십시오."
  es: "El texto usa una codificación ilegible o contiene caracteres de control. Guardar una copia en UTF-8 y eliminar caracteres de control como los saltos de página."
  fr: "L’encodage est illisible ou le texte contient des caractères de contrôle. Enregistrez une copie en UTF-8 et retirez les caractères de contrôle, comme les sauts de page."
  de: "Der Text verwendet eine unlesbare Kodierung oder enthält Steuerzeichen. Speichern Sie eine Kopie als UTF-8 und entfernen Sie Steuerzeichen wie Seitenvorschübe."
  pt-BR: "O texto usa uma codificação ilegível ou contém caracteres de controle. Salve uma cópia em UTF-8 e remova caracteres de controle, como quebras de página."
  id: "Teks memakai pengodean yang tidak terbaca atau memuat karakter kontrol. Simpan salinan sebagai UTF-8 dan hapus karakter kontrol seperti pemisah halaman."

