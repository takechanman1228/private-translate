models.quality_legend:
  en: "Quality (higher is better): Ja↔En = PFTB, multilingual = FLORES+ chrF++ (Ja↔14 languages). In parentheses: difference from the unquantized model."
  ja: "品質（高いほど良い）: 日英 = PFTB、多言語 = FLORES+ chrF++（日本語↔14 言語）。カッコ内は量子化なし（BF16）との差。"
  zh-Hans: "质量（越高越好）：日语↔英语采用 PFTB，多语言采用 FLORES+ chrF++（日语↔14 种语言）。括号内为与未量化模型的分差。"
  zh-Hant: "品質（越高越好）：日文↔英文採用 PFTB，多語言採用 FLORES+ chrF++（日文↔14 種語言）。括號內是與未量化模型的分數差。"
  ko: "품질은 높을수록 좋습니다. 일본어↔영어는 PFTB, 다국어는 FLORES+ chrF++(일본어↔14개 언어) 기준입니다. 괄호는 양자화하지 않은 모델과의 점수 차이입니다."
  es: "Calidad (cuanto mayor, mejor): japonés ↔ inglés usa PFTB y la prueba multilingüe usa FLORES+ chrF++ (japonés ↔ 14 idiomas). Entre paréntesis figura la diferencia con el modelo sin cuantizar."
  fr: "Qualité (plus élevée = meilleure) : japonais ↔ anglais selon PFTB, multilingue selon FLORES+ chrF++ (japonais ↔ 14 langues). L’écart avec le modèle non quantifié figure entre parenthèses."
  de: "Qualität (höher ist besser): Japanisch ↔ Englisch nach PFTB, mehrsprachig nach FLORES+ chrF++ (Japanisch ↔ 14 Sprachen). In Klammern steht die Abweichung vom unquantisierten Modell."
  pt-BR: "Qualidade (quanto maior, melhor): japonês ↔ inglês usa PFTB e a avaliação multilíngue usa FLORES+ chrF++ (japonês ↔ 14 idiomas). Entre parênteses, a diferença em relação ao modelo sem quantização."
  id: "Kualitas (makin tinggi makin baik): Jepang ↔ Inggris memakai PFTB, multibahasa memakai FLORES+ chrF++ (Jepang ↔ 14 bahasa). Tanda kurung menunjukkan selisih dari model tanpa kuantisasi."
