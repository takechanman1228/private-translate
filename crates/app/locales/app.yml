  zh-Hans: "使用当前模型在 CPU 和各 GPU 上翻译一小段文本，自动选用最快的设备。耗时几秒到一分钟。"
  zh-Hant: "使用目前的模型在 CPU 和各 GPU 上翻譯一小段文字，自動選用最快的裝置。需時數秒到一分鐘。"
  ko: "현재 모델로 CPU와 각 GPU에서 짧은 텍스트를 번역합니다. 자동 모드에서는 가장 빠른 장치를 사용합니다. 몇 초에서 1분 정도 걸립니다."
  es: "Traduce un texto breve con el modelo actual en la CPU y en cada GPU. El modo automático usa el dispositivo más rápido. Tarda de unos segundos a un minuto."
  fr: "Traduit un texte court avec le modèle actuel sur le CPU et chaque GPU. Le mode automatique utilise le plus rapide. Comptez de quelques secondes à une minute."
  de: "Übersetzt mit dem aktuellen Modell einen kurzen Text auf der CPU und jeder GPU. Im Automatikmodus wird das schnellste Gerät verwendet. Das dauert einige Sekunden bis zu einer Minute."
  pt-BR: "Traduz um texto curto com o modelo atual na CPU e em cada GPU. O modo automático usa o dispositivo mais rápido. Leva de alguns segundos a um minuto."
  id: "Menerjemahkan teks pendek dengan model saat ini pada CPU dan setiap GPU. Mode otomatis memakai perangkat tercepat. Prosesnya perlu beberapa detik hingga satu menit."
