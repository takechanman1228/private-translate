models.folder_failed:
  en: "Cannot choose a folder: %{message}. The folder can also be set as \"models_dir\" in settings.json."
  ja: "保存先を選べません: %{message}。settings.json の \"models_dir\" でも指定できます。"
  zh-Hans: "无法选择文件夹：%{message}。也可在 settings.json 中设置 «models_dir»。"
  zh-Hant: "無法選擇資料夾：%{message}。也可以在 settings.json 中設定「models_dir」。"
  ko: "폴더를 선택할 수 없습니다: %{message}. settings.json의 “models_dir”에서 폴더를 설정할 수도 있습니다."
  es: "No se puede elegir una carpeta: %{message}. También se puede configurar «models_dir» en settings.json."
  fr: "Impossible de choisir un dossier : %{message}. Vous pouvez aussi définir « models_dir » dans settings.json."
  de: "Der Ordner kann nicht ausgewählt werden: %{message}. Sie können ihn auch über „models_dir“ in settings.json festlegen."
  pt-BR: "Não foi possível escolher uma pasta: %{message}. Também é possível definir “models_dir” no arquivo settings.json."
  id: "Tidak dapat memilih folder: %{message}. Folder juga dapat diatur melalui “models_dir” di settings.json."

