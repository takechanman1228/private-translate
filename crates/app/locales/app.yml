  ja: "ファイル選択画面を開けませんでした。"
  zh-Hans: "无法打开文件选择窗口。"
  zh-Hant: "無法打開檔案選擇視窗。"
  ko: "파일 선택 창을 열 수 없습니다."
  es: "No se pudo abrir el selector de archivos."
  fr: "Impossible d’ouvrir la fenêtre de sélection de fichiers."
  de: "Dateiauswahl konnte nicht geöffnet werden."
  pt-BR: "Não foi possível abrir o seletor de arquivos."
  id: "Pemilih file tidak dapat dibuka."

files.close_title:
