  ko: "반복되는 제목 문단 %{count}개의 번역을 처음 나온 위치의 추가 페이지에 모았습니다."
  es: "Se agrupó la traducción de %{count} párrafo de encabezado repetido en páginas añadidas junto a su primera aparición."
  fr: "La traduction de %{count} paragraphe de titre répété a été regroupée sur des pages supplémentaires à sa première occurrence."
  de: "Die Übersetzung der wiederkehrenden Überschrift (%{count}) wurde beim ersten Vorkommen auf Zusatzseiten zusammengefasst."
  pt-BR: "A tradução de %{count} parágrafo de título repetido foi reunida em páginas adicionais na primeira ocorrência."
  id: "Terjemahan dari %{count} paragraf judul berulang dihimpun di halaman tambahan pada kemunculan pertamanya."

files.pdf_square_markers:
  en: "□ marks characters unavailable in this PDF's font, or formula positions."
  ja: "□ は、このPDFのフォントで表示できない文字、または数式の位置を示します。"
  zh-Hans: "□ 表示 PDF 字体无法显示的字符或公式的位置。"
  zh-Hant: "□ 標示 PDF 字型無法顯示的字元或公式位置。"
  ko: "□는 PDF 글꼴에 없는 문자나 수식 위치를 나타냅니다."
  es: "□ marca caracteres no disponibles en la fuente del PDF o posiciones de fórmulas."
  fr: "□ indique un caractère absent de la police du PDF ou l’emplacement d’une formule."
  de: "□ markiert Zeichen, die in der PDF-Schrift fehlen, oder die Position von Formeln."
  pt-BR: "□ indica caracteres indisponíveis na fonte do PDF ou posições de fórmulas."
  id: "□ menandai karakter yang tidak tersedia pada font PDF atau posisi rumus."

files.path_too_long:
  en: "The destination path is too long. Use Save as… to choose a folder closer to the drive root or a shorter filename."
  ja: "保存先のパスが長すぎます。「名前を付けて保存…」で、浅いフォルダーか短い名前を選んでください。"
  zh-Hans: "目标路径太长。请用「另存为…」选择更靠近驱动器根目录的文件夹，或使用较短的文件名。"
  zh-Hant: "目的地路徑太長。請使用「另存新檔…」選擇更接近磁碟根目錄的資料夾，或使用較短的檔名。"
  ko: "대상 경로가 너무 깁니다. ‘다른 이름으로 저장…’에서 드라이브 루트에 가까운 폴더나 더 짧은 파일 이름을 선택하십시오."
  es: "La ruta de destino es demasiado larga. Usar «Guardar como…» para elegir una carpeta más próxima a la raíz de la unidad o un nombre más corto."
  fr: "Le chemin de destination est trop long. Utilisez « Enregistrer sous… » pour choisir un dossier plus près de la racine du disque ou un nom plus court."
  de: "Der Zielpfad ist zu lang. Wählen Sie über „Speichern unter…“ einen Ordner näher am Laufwerksstamm oder einen kürzeren Dateinamen."
  pt-BR: "O caminho de destino é longo demais. Use “Salvar como…” para escolher uma pasta mais próxima da raiz da unidade ou um nome mais curto."
  id: "Jalur tujuan terlalu panjang. Gunakan “Simpan sebagai…” untuk memilih folder yang lebih dekat ke direktori akar atau nama file lebih pendek."

files.save_beside_failed:
  en: "Could not write to the source folder. Use Save as… to choose another folder."
  ja: "元のファイルのフォルダーに書き込めません。「名前を付けて保存…」で別のフォルダーを選んでください。"
  zh-Hans: "无法写入源文件夹。请用「另存为…」选择其他文件夹。"
  zh-Hant: "無法寫入來源資料夾。請使用「另存新檔…」選擇其他資料夾。"
  ko: "원본 폴더에 쓸 수 없습니다. ‘다른 이름으로 저장…’에서 다른 폴더를 선택하십시오."
  es: "No se pudo escribir en la carpeta de origen. Usar «Guardar como…» para elegir otra carpeta."
  fr: "Impossible d’écrire dans le dossier source. Utilisez « Enregistrer sous… » pour choisir un autre dossier."
  de: "In den Quellordner konnte nicht geschrieben werden. Wählen Sie über „Speichern unter…“ einen anderen Ordner."
  pt-BR: "Não foi possível gravar na pasta de origem. Use “Salvar como…” para escolher outra pasta."
  id: "Tidak dapat menulis ke folder sumber. Gunakan “Simpan sebagai…” untuk memilih folder lain."

files.folder:
  en: "A folder was selected. Choose one file inside it."
  ja: "フォルダーが選ばれました。中のファイルを1件選んでください。"
  zh-Hans: "选中的是文件夹。请选择其中一个文件。"
  zh-Hant: "目前選取的是資料夾。請選擇其中一個檔案。"
  ko: "폴더가 선택되었습니다. 그 안의 파일 하나를 선택하십시오."
  es: "Se seleccionó una carpeta. Elegir un archivo de esa carpeta."
  fr: "Un dossier est sélectionné. Choisissez un fichier dans ce dossier."
  de: "Ein Ordner wurde ausgewählt. Wählen Sie eine Datei darin."
  pt-BR: "Uma pasta foi selecionada. Escolha um arquivo dentro dela."
  id: "Folder dipilih. Pilih satu file di dalamnya."

files.office_limit:
  en: "Word and PowerPoint limits are 128 MiB per file, 512 MiB unpacked, 4,096 internal items, and 8 MiB per XML part read. Split the document or reduce embedded content."
  ja: "Word・PowerPointの上限は、ファイル128 MiB、展開後の合計512 MiB、内部の項目4,096件、読み込むXML 1件あたり8 MiBです。文書を分割するか、埋め込みデータを減らしてください。"
  zh-Hans: "Word 和 PowerPoint 的限制：单个文件 128 MiB、解包后 512 MiB、4096 个内部项、单个读取的 XML 部件 8 MiB。请拆分文档或减少嵌入内容。"
  zh-Hant: "Word 與 PowerPoint 的限制為每個檔案 128 MiB、解壓縮後 512 MiB、4096 個內部項目，以及每個讀取的 XML 部分 8 MiB。請分割文件或減少內嵌內容。"
  ko: "Word 및 PowerPoint의 한도는 파일당 128MiB, 압축 해제 후 512MiB, 내부 항목 4,096개, 읽는 XML 부분당 8MiB입니다. 문서를 나누거나 포함된 콘텐츠를 줄이십시오."
  es: "Límites de Word y PowerPoint: 128 MiB por archivo, 512 MiB descomprimido, 4096 elementos internos y 8 MiB por parte XML leída. Dividir el documento o reducir el contenido incrustado."
  fr: "Limites de Word et PowerPoint : 128 Mio par fichier, 512 Mio après décompression, 4 096 éléments internes et 8 Mio par partie XML lue. Scindez le document ou réduisez le contenu incorporé."
  de: "Grenzen für Word und PowerPoint: 128 MiB je Datei, 512 MiB entpackt, 4.096 interne Elemente und 8 MiB je gelesenem XML-Teil. Teilen Sie das Dokument oder reduzieren Sie eingebettete Inhalte."
  pt-BR: "Limites de Word e PowerPoint: 128 MiB por arquivo, 512 MiB descompactado, 4.096 itens internos e 8 MiB por parte XML lida. Divida o documento ou reduza o conteúdo inserido."
  id: "Batas Word dan PowerPoint: 128 MiB per file, 512 MiB setelah diekstrak, 4.096 item internal, dan 8 MiB per bagian XML yang dibaca. Bagi dokumen atau kurangi konten yang disematkan."

files.office_package:
  en: "The Office file could not be read in this format. Open it in Word or PowerPoint and save a new .docx, .pptx or PDF copy."
  ja: "Office ファイルの構造を読み取れません。Word または PowerPoint で開き、.docx・.pptx または PDF のコピーを保存してください。"
  zh-Hans: "无法读取此格式的 Office 文件。请在 Word 或 PowerPoint 中打开，另存为 .docx、.pptx 或 PDF。"
  zh-Hant: "無法讀取此格式的 Office 檔案。請用 Word 或 PowerPoint 打開，另存為 .docx、.pptx 或 PDF。"
  ko: "이 형식의 Office 파일을 읽을 수 없습니다. Word나 PowerPoint에서 열고 .docx, .pptx 또는 PDF 복사본으로 저장하십시오."
  es: "No se pudo leer el archivo de Office en este formato. Abrirlo en Word o PowerPoint y guardar una copia en .docx, .pptx o PDF."
  fr: "Impossible de lire le fichier Office dans ce format. Ouvrez-le dans Word ou PowerPoint et enregistrez une copie au format .docx, .pptx ou PDF."
  de: "Die Office-Datei ließ sich in diesem Format nicht lesen. Öffnen Sie sie in Word oder PowerPoint und speichern Sie eine Kopie als .docx, .pptx oder PDF."
  pt-BR: "Não foi possível ler o arquivo do Office nesse formato. Abra no Word ou PowerPoint e salve uma cópia em .docx, .pptx ou PDF."
  id: "File Office tidak dapat dibaca dalam format ini. Buka di Word atau PowerPoint, lalu simpan salinan .docx, .pptx, atau PDF."

