  zh-Hans: "下载已中断。重试可继续下载。下载需要联网，翻译可离线进行。"
  zh-Hant: "下載已中斷。重試即可繼續下載。下載需要網路，翻譯可離線進行。"
  ko: "다운로드가 중단되었습니다. 다시 시도하면 이어서 받을 수 있습니다. 다운로드에는 인터넷이 필요하며 번역은 오프라인에서 작동합니다."
  es: "Se ha interrumpido la descarga. Vuelve a intentarlo para continuar. La descarga requiere internet. La traducción funciona sin conexión."
  fr: "Le téléchargement a été interrompu. Réessayez pour reprendre. Le téléchargement nécessite Internet. La traduction fonctionne hors ligne."
  de: "Der Download wurde unterbrochen. Versuchen Sie es erneut, um fortzufahren. Für den Download ist Internet nötig. Die Übersetzung funktioniert offline."
  pt-BR: "O download foi interrompido. Tente de novo para continuar. O download precisa de internet. A tradução funciona offline."
  id: "Unduhan terputus. Coba lagi untuk melanjutkan. Unduhan memerlukan internet. Terjemahan berjalan secara offline."
