  pt-BR: "Detectar por arquivo"
  id: "Deteksi per file"

files.batch_folder_permission:
  en: "You do not have permission to save here. Copy the original to a writable folder and translate it again."
  ja: "このフォルダーに保存する権限がありません。元のファイルを書き込めるフォルダーにコピーして、もう一度翻訳してください。"
  zh-Hans: "你没有在此处保存的权限。请将原文件复制到可写入的文件夹，然后重新翻译。"
  zh-Hant: "無權限儲存到這裡。請將原始檔案複製到可寫入的資料夾，再重新翻譯。"
  ko: "여기에 저장할 권한이 없습니다. 원본을 쓰기 가능한 폴더에 복사한 후 다시 번역하십시오."
  es: "No hay permiso para guardar aquí. Copiar el original a una carpeta con permiso de escritura y volver a traducirlo."
  fr: "Vous n’avez pas l’autorisation d’enregistrer ici. Copiez l’original dans un dossier où vous pouvez écrire, puis retraduisez-le."
  de: "Sie haben hier keine Schreibberechtigung. Kopieren Sie das Original in einen beschreibbaren Ordner und übersetzen Sie es erneut."
  pt-BR: "Você não tem permissão para salvar aqui. Copie o original para uma pasta gravável e traduza de novo."
  id: "Anda tidak memiliki izin untuk menyimpan di sini. Salin file asli ke folder yang bisa ditulisi, lalu terjemahkan lagi."

files.batch_folder_failed:
  en: "Could not save beside the original. Copy it to another folder and translate it again."
  ja: "元のファイルと同じフォルダーに保存できません。別のフォルダーにコピーして、もう一度翻訳してください。"
  zh-Hans: "无法将译文保存在原文件旁。请将原文件复制到其他文件夹，然后重新翻译。"
  zh-Hant: "無法儲存在原始檔案旁。請將原始檔案複製到其他資料夾，再重新翻譯。"
  ko: "원본과 같은 폴더에 저장할 수 없습니다. 원본을 다른 폴더에 복사한 후 다시 번역하십시오."
  es: "No se pudo guardar junto al original. Copiar el original a otra carpeta y volver a traducirlo."
  fr: "Impossible d’enregistrer à côté de l’original. Copiez l’original dans un autre dossier et retraduisez-le."
  de: "Speichern im Ordner des Originals fehlgeschlagen. Kopieren Sie es in einen anderen Ordner und übersetzen Sie es erneut."
  pt-BR: "Não foi possível salvar junto do original. Copie o original para outra pasta e traduza de novo."
  id: "Tidak dapat menyimpan di folder file asli. Salin file asli ke folder lain, lalu terjemahkan lagi."

files.batch_path_long:
  en: "The destination path is too long. Translate a copy with a shorter name or in a folder closer to the drive root."
  ja: "保存先のパスが長すぎます。浅いフォルダーにコピーするか、コピーに短い名前を付けて、もう一度翻訳してください。"
  zh-Hans: "目标路径太长。请缩短副本名称或将副本放到更靠近驱动器根目录的文件夹，再翻译。"
  zh-Hant: "目的地路徑太長。請縮短副本名稱，或將副本放到更接近磁碟根目錄的資料夾，再進行翻譯。"
  ko: "대상 경로가 너무 깁니다. 복사본의 이름을 줄이거나 드라이브 루트에 더 가까운 폴더에서 번역하십시오."
  es: "La ruta de destino es demasiado larga. Traducir una copia con un nombre más corto o en una carpeta más próxima a la raíz de la unidad."
  fr: "Le chemin de destination est trop long. Traduisez une copie au nom plus court ou dans un dossier plus près de la racine du disque."
  de: "Der Zielpfad ist zu lang. Übersetzen Sie eine Kopie mit kürzerem Namen oder in einem Ordner näher am Laufwerksstamm."
  pt-BR: "O caminho de destino é longo demais. Traduza uma cópia com nome mais curto ou em uma pasta mais próxima da raiz da unidade."
  id: "Jalur tujuan terlalu panjang. Terjemahkan salinan dengan nama lebih pendek atau dari folder yang lebih dekat ke direktori akar."

