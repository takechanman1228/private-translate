  ja: "翻訳できる本文がありません。"
  zh-Hans: "未找到可翻译的文本。"
  zh-Hant: "找不到可翻譯的文字。"
  ko: "번역할 수 있는 텍스트가 없습니다."
  es: "No se encontró texto para traducir."
  fr: "Aucun texte à traduire n’a été trouvé."
  de: "Kein übersetzbarer Text gefunden."
  pt-BR: "Não foi encontrado texto para traduzir."
  id: "Tidak ada teks yang dapat diterjemahkan."

files.pdf_empty:
  en: "No translatable PDF text was found. Scanned pages without a text layer need OCR first."
  ja: "PDFに翻訳できる本文がありません。文字情報のないスキャンは先にOCRが必要です。"
  zh-Hans: "未找到可翻译的 PDF 文本。没有文本层的扫描页需要先进行 OCR。"
  zh-Hant: "找不到可翻譯的 PDF 文字。沒有文字圖層的掃描頁面需要先做 OCR。"
  ko: "PDF에 번역할 수 있는 텍스트가 없습니다. 텍스트 레이어가 없는 스캔 페이지는 먼저 OCR을 실행하십시오."
  es: "No se encontró texto para traducir en el PDF. Las páginas escaneadas sin capa de texto requieren OCR."
  fr: "Aucun texte traduisible dans le PDF. Pour les pages numérisées sans couche de texte, utilisez d’abord la reconnaissance de caractères (OCR)."
  de: "Kein übersetzbarer PDF-Text gefunden. Gescannte Seiten ohne Textebene benötigen zuerst eine Texterkennung (OCR)."
  pt-BR: "Não há texto para traduzir no PDF. Páginas digitalizadas sem camada de texto precisam passar por OCR primeiro."
  id: "Tidak ada teks PDF yang dapat diterjemahkan. Jalankan OCR terlebih dahulu pada halaman pindaian tanpa lapisan teks."

