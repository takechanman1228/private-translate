models.bf16_reference:
  en: "Unquantized: Ja↔En %{ja} / multilingual %{multi}"
  ja: "量子化なし: 日英 %{ja} / 多言語 %{multi}"
  zh-Hans: "未量化：日语↔英语 %{ja} / 多语言 %{multi}"
  zh-Hant: "未量化：日文↔英文 %{ja} / 多語言 %{multi}"
  ko: "양자화 전: 일본어↔영어 %{ja} / 다국어 %{multi}"
  es: "Sin cuantizar: japonés↔inglés %{ja} / multilingüe %{multi}"
  fr: "Non quantifié : japonais↔anglais %{ja} / multilingue %{multi}"
  de: "Unquantisiert: Japanisch↔Englisch %{ja} / mehrsprachig %{multi}"
  pt-BR: "Sem quantização: japonês↔inglês %{ja} / multilíngue %{multi}"
  id: "Tanpa kuantisasi: Jepang↔Inggris %{ja} / multibahasa %{multi}"
models.size_08b:
  en: Smallest and fastest. Runs well even without a GPU; quality is a step below 2B.
  ja: 最小・最速。GPU なしでも軽快に動きます。品質は 2B より一段下です。
  zh-Hans: "体积最小，速度最快。没有 GPU 也能流畅运行，质量略低于 2B。"
  zh-Hant: "體積最小，速度最快。沒有 GPU 也能順暢執行，品質略低於 2B。"
  ko: "가장 작고 빠릅니다. GPU 없이도 잘 실행되며 품질은 2B보다 낮습니다."
  es: "El más pequeño y rápido. Funciona bien sin GPU, con una calidad algo inferior a 2B."
  fr: "Le plus petit et le plus rapide. Fonctionne bien sans GPU, avec une qualité légèrement inférieure à celle de 2B."
  de: "Kleinstes und schnellstes Modell. Läuft auch ohne GPU gut, mit etwas geringerer Qualität als 2B."
  pt-BR: "O menor e mais rápido. Funciona bem sem GPU, com qualidade um pouco abaixo do 2B."
  id: "Paling kecil dan cepat. Berjalan baik tanpa GPU, dengan kualitas sedikit di bawah 2B."
models.size_2b:
  en: Balanced speed and quality. Practical on a CPU, very fast on a GPU.
  ja: 速度と品質のバランス型。CPU でも実用的で、GPU ならとても高速です。
  zh-Hans: "兼顾速度和质量。可在 CPU 上运行，在 GPU 上很快。"
  zh-Hant: "兼顧速度與品質。可用 CPU 執行，在 GPU 上速度很快。"
  ko: "속도와 품질의 균형이 좋습니다. CPU에서 쓸 만하며 GPU에서는 매우 빠릅니다."
  es: "Equilibrio entre velocidad y calidad. Práctico con CPU y muy rápido con GPU."
  fr: "Bon équilibre entre vitesse et qualité. Pratique sur CPU, très rapide sur GPU."
  de: "Ausgewogen bei Tempo und Qualität. Gut auf der CPU nutzbar und sehr schnell auf der GPU."
  pt-BR: "Equilíbrio entre velocidade e qualidade. Funciona bem em CPU e é muito rápido em GPU."
  id: "Kecepatan dan kualitas seimbang. Praktis di CPU dan sangat cepat di GPU."
models.size_8b:
  en: High quality. A GPU with 8 GB or more is recommended.
  ja: 高品質。8 GB 以上の GPU を推奨します。
  zh-Hans: "高质量。建议使用至少有 8 GB 显存的 GPU。"
  zh-Hant: "高品質。建議使用至少有 8 GB 記憶體的 GPU。"
  ko: "품질이 높습니다. 메모리 8GB 이상의 GPU를 권장합니다."
  es: "Alta calidad. Se recomienda una GPU de al menos 8 GB."
  fr: "Haute qualité. GPU de 8 Go ou plus recommandé."
  de: "Hohe Qualität. Empfohlen wird eine GPU mit mindestens 8 GB."
  pt-BR: "Alta qualidade. Recomenda-se uma GPU com pelo menos 8 GB."
  id: "Kualitas tinggi. Disarankan GPU dengan memori minimal 8 GB."
models.size_31b:
  en: Best quality. Needs about 20 GB of memory at Q4_K_M; slow without a large GPU.
  ja: 最高品質。Q4_K_M で約 20 GB のメモリが必要で、大容量の GPU がないと低速です。
  zh-Hans: "质量最高。Q4_K_M 需要约 20 GB 内存；没有大显存 GPU 时运行较慢。"
  zh-Hant: "品質最高。Q4_K_M 需要約 20 GB 記憶體；沒有足夠記憶體的 GPU 時速度較慢。"
  ko: "품질이 가장 높습니다. Q4_K_M은 약 20GB의 메모리가 필요하며 메모리가 큰 GPU가 없으면 느립니다."
  es: "La mejor calidad. Q4_K_M necesita unos 20 GB de memoria. Es lento sin una GPU con suficiente memoria."
  fr: "Qualité maximale. Q4_K_M demande environ 20 Go de mémoire. Lent sans GPU à grande mémoire."
  de: "Beste Qualität. Q4_K_M benötigt etwa 20 GB Speicher. Ohne GPU mit viel Speicher langsam."
  pt-BR: "Melhor qualidade. Q4_K_M precisa de cerca de 20 GB de memória. Lento sem uma GPU com bastante memória."
  id: "Kualitas tertinggi. Q4_K_M perlu sekitar 20 GB memori. Lambat tanpa GPU bermemori besar."
models.size_other:
  en: Newly published size.
  ja: 新しく公開されたサイズです。
  zh-Hans: "新发布的大小。"
  zh-Hant: "新發布的大小。"
  ko: "새로 공개된 크기입니다."
  es: "Tamaño recién publicado."
  fr: "Taille récemment publiée."
  de: "Neu veröffentlichte Größe."
  pt-BR: "Tamanho recém-publicado."
  id: "Ukuran yang baru dirilis."
models.quant_q4km:
  en: Practically the same quality as unquantized.
  ja: 量子化なしとほぼ同等の品質です。
  zh-Hans: "质量与未量化模型基本相同。"
  zh-Hant: "品質與未量化模型幾乎相同。"
  ko: "양자화하지 않은 모델과 품질이 거의 같습니다."
  es: "Calidad prácticamente igual a la del modelo sin cuantizar."
  fr: "Qualité presque identique à celle du modèle non quantifié."
  de: "Fast gleiche Qualität wie beim unquantisierten Modell."
  pt-BR: "Qualidade praticamente igual à do modelo sem quantização."
  id: "Kualitas hampir sama dengan model tanpa kuantisasi."
models.quant_q40:
  en: Slightly smaller; tuned for phones. Multilingual quality drops a little.
  ja: やや小さく、スマートフォン向けに最適化。多言語の品質が少し下がります。
  zh-Hans: "体积稍小，针对手机优化。多语言质量略有下降。"
  zh-Hant: "體積稍小，針對手機最佳化。多語言品質略降。"
  ko: "조금 더 작고 휴대전화에 최적화되어 있습니다. 다국어 품질이 조금 낮습니다."
  es: "Algo más pequeño y optimizado para móviles. Ligera pérdida de calidad multilingüe."
  fr: "Un peu plus petit et optimisé pour les téléphones. Légère baisse de qualité multilingue."
  de: "Etwas kleiner, für Smartphones optimiert. Etwas geringere Qualität bei mehreren Sprachen."
  pt-BR: "Um pouco menor e otimizado para celulares. Pequena perda de qualidade multilíngue."
  id: "Sedikit lebih kecil, dioptimalkan untuk ponsel. Kualitas multibahasa sedikit menurun."
models.quant_q3km:
  en: Smaller, with a small quality loss.
  ja: 小さめ。品質はわずかに下がります。
  zh-Hans: "体积更小，质量略有下降。"
  zh-Hant: "體積更小，品質略降。"
  ko: "더 작고 품질이 조금 낮습니다."
  es: "Más pequeño, con una ligera pérdida de calidad."
  fr: "Plus petit, avec une légère perte de qualité."
  de: "Kleiner, mit leichtem Qualitätsverlust."
  pt-BR: "Menor, com pequena perda de qualidade."
  id: "Lebih kecil, dengan sedikit penurunan kualitas."
models.quant_q2k:
  en: Smallest, with a noticeable quality loss.
  ja: 最小。品質の低下がはっきり出ます。
  zh-Hans: "体积最小，质量明显下降。"
  zh-Hant: "體積最小，品質明顯下降。"
  ko: "가장 작고 품질이 눈에 띄게 낮습니다."
  es: "El más pequeño, con una pérdida de calidad notable."
  fr: "Le plus petit, avec une perte de qualité nette."
  de: "Am kleinsten, mit deutlichem Qualitätsverlust."
  pt-BR: "O menor, com perda perceptível de qualidade."
  id: "Paling kecil, dengan penurunan kualitas yang terlihat."
models.quant_q80:
  en: Larger, nearly lossless.
  ja: 大きめ。ほぼ劣化なし。
  zh-Hans: "体积较大，质量几乎无损。"
  zh-Hant: "體積較大，品質幾乎無損。"
  ko: "더 크고 품질 손실이 거의 없습니다."
  es: "Más grande, con una pérdida de calidad casi imperceptible."
  fr: "Plus volumineux, avec une perte de qualité minime."
  de: "Größer, mit kaum merklichem Qualitätsverlust."
  pt-BR: "Maior, quase sem perda de qualidade."
  id: "Lebih besar, hampir tanpa penurunan kualitas."
