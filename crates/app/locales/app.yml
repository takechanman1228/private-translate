files.cancelled:
  en: "Cancelled. No output file was saved. You can translate again."
  ja: "中止しました。出力ファイルは保存していません。再実行できます。"
  zh-Hans: "已取消，未保存输出文件。可以重新翻译。"
  zh-Hant: "已取消，尚未儲存輸出檔案。可以重新翻譯。"
  ko: "취소되었습니다. 저장된 출력 파일이 없습니다. 다시 번역할 수 있습니다."
  es: "Operación cancelada. No se guardó ningún archivo. Se puede volver a traducir."
  fr: "Opération annulée. Aucun fichier n’a été enregistré. Vous pouvez relancer la traduction."
  de: "Abgebrochen. Es wurde keine Ausgabedatei gespeichert. Sie können erneut übersetzen."
  pt-BR: "Operação cancelada. Nenhum arquivo de saída foi salvo. Você pode traduzir novamente."
  id: "Dibatalkan. Tidak ada file keluaran yang disimpan. Anda dapat menerjemahkan lagi."

files.translation_failed:
  en: "Translation failed. No output was saved. Check the model and retry."
  ja: "翻訳に失敗しました。モデルを確認して再実行してください。出力は保存していません。"
  zh-Hans: "翻译失败，未保存输出文件。请检查模型后重试。"
  zh-Hant: "翻譯失敗，未儲存輸出檔案。請檢查模型後再試一次。"
  ko: "번역에 실패했습니다. 출력 파일은 저장되지 않았습니다. 모델을 확인한 후 다시 시도하십시오."
  es: "Falló la traducción. No se guardó ningún archivo. Revisar el modelo y volver a intentar."
  fr: "La traduction a échoué. Aucun fichier n’a été enregistré. Vérifiez le modèle, puis réessayez."
  de: "Übersetzung fehlgeschlagen. Es wurde keine Ausgabedatei gespeichert. Prüfen Sie das Modell und versuchen Sie es erneut."
  pt-BR: "Falha na tradução. Nenhum arquivo de saída foi salvo. Confira o modelo e tente novamente."
  id: "Terjemahan gagal. Tidak ada file keluaran yang disimpan. Periksa model, lalu coba lagi."

files.pdf_password:
  en: "This PDF requires a password. Open a copy with the password removed, or ask the owner for one."
  ja: "このPDFを開くにはパスワードが必要です。パスワードを外したコピーを開いてください。必要なら所有者に依頼してください。"
  zh-Hans: "此 PDF 需要密码。请打开已移除密码的副本，或向所有者索取。"
  zh-Hant: "這份 PDF 需要密碼。請打開已移除密碼的副本，或向擁有者索取。"
  ko: "이 PDF에는 암호가 필요합니다. 암호를 제거한 복사본을 열거나 소유자에게 요청하십시오."
  es: "Este PDF requiere contraseña. Abrir una copia sin contraseña o solicitarla a la persona propietaria."
  fr: "Ce PDF nécessite un mot de passe. Ouvrez une copie dont le mot de passe a été retiré ou demandez-en une au propriétaire."
  de: "Diese PDF-Datei erfordert ein Passwort. Öffnen Sie eine Kopie ohne Passwortschutz oder bitten Sie den Eigentümer um eine solche Kopie."
  pt-BR: "Este PDF exige senha. Abra uma cópia sem senha ou peça uma ao proprietário."
  id: "PDF ini memerlukan kata sandi. Buka salinan yang kata sandinya sudah dihapus atau minta salinan kepada pemilik."

files.pdf_edit_restricted:
  en: "Editing is restricted for this PDF, so a translated PDF cannot be created. If the text can be copied, paste it into the text translation instead."
  ja: "このPDFは編集が制限されているため、翻訳したPDFを作成できません。本文をコピーできる場合は、テキスト翻訳に貼り付けて翻訳できます。"
  zh-Hans: "此 PDF 限制编辑，无法创建翻译版 PDF。如果文本可复制，可粘贴到「文本」标签页翻译。"
  zh-Hant: "這份 PDF 限制編輯，無法建立翻譯版 PDF。如果文字可複製，可貼到「文字」分頁翻譯。"
  ko: "편집이 제한된 PDF이므로 번역한 PDF를 만들 수 없습니다. 텍스트를 복사할 수 있으면 텍스트 탭에 붙여넣으십시오."
  es: "Este PDF tiene restricciones de edición, por lo que no se puede crear un PDF traducido. Si se puede copiar el texto, pegarlo en la pestaña Texto."
  fr: "Ce PDF est protégé contre la modification. Si vous pouvez copier le texte, collez-le dans l’onglet Texte pour le traduire."
  de: "Die PDF-Datei ist vor Bearbeitung geschützt. Wenn sich der Text kopieren lässt, fügen Sie ihn zum Übersetzen im Tab „Text“ ein."
  pt-BR: "A edição deste PDF é restrita, por isso não é possível criar um PDF traduzido. Se der para copiar o texto, cole-o na aba Texto."
  id: "Pengeditan PDF ini dibatasi sehingga PDF terjemahan tidak bisa dibuat. Jika teks bisa disalin, tempel di tab Teks untuk menerjemahkannya."

files.pdf_protected:
  en: "This PDF is protected. Ask the owner for a translatable copy."
  ja: "このPDFは保護されています。翻訳できるコピーを所有者に依頼してください。"
  zh-Hans: "此 PDF 受保护。请向所有者索取可翻译的副本。"
  zh-Hant: "這份 PDF 受到保護。請向擁有者索取可翻譯的副本。"
  ko: "보호된 PDF입니다. 소유자에게 번역 가능한 복사본을 요청하십시오."
  es: "Este PDF está protegido. Solicitar a la persona propietaria una copia que se pueda traducir."
  fr: "Ce PDF est protégé. Demandez au propriétaire une copie que vous pourrez traduire."
  de: "Diese PDF-Datei ist geschützt. Bitten Sie den Eigentümer um eine übersetzbare Kopie."
  pt-BR: "Este PDF está protegido. Peça ao proprietário uma cópia que possa ser traduzida."
  id: "PDF ini dilindungi. Minta salinan yang dapat diterjemahkan kepada pemilik."

files.picker_failed:
