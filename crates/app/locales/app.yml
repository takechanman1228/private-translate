settings.document_note:
  en: "Long texts are split between paragraphs into chunks of at most this size and translated in order, each with up to this much of the preceding text and its translation. Larger chunks make loops and skipped passages more likely."
  ja: "長い文章は、段落の切れ目でこの大きさ以下の塊に分けて順に訳します。各塊には、直前の原文と訳文をこの量まで添えます。塊を大きくすると、繰り返しや訳抜けが起きやすくなります。"
  zh-Hans: "长文本按段落拆成不超过指定大小的片段，并按顺序翻译。每段可参考指定长度内的前文及其译文。片段越大，越容易出现重复或漏译。"
  zh-Hant: "長文字會按段落切成不超過指定大小的片段，依序翻譯。每段可參考指定長度內的前文與譯文。片段越大，越可能出現重複或漏譯。"
  ko: "긴 텍스트는 문단 경계에서 설정한 크기 이하로 나눠 순서대로 번역합니다. 각 부분은 지정한 양만큼 앞 텍스트와 번역을 참고합니다. 크기가 클수록 반복과 누락이 발생하기 쉽습니다."
  es: "Los textos largos se dividen entre párrafos en segmentos de hasta el tamaño indicado. Se traducen en orden, usando la cantidad indicada de texto anterior y su traducción. Los segmentos grandes aumentan el riesgo de repeticiones y omisiones."
  fr: "Les textes longs sont découpés entre les paragraphes, puis traduits dans l’ordre. Chaque segment respecte la taille maximale et utilise la quantité indiquée de texte précédent et de sa traduction. Les grands segments favorisent les répétitions et les omissions."
  de: "Lange Texte werden an Absatzgrenzen in Abschnitte bis zur gewählten Größe unterteilt und der Reihe nach übersetzt. Pro Abschnitt werden bis zur gewählten Menge an vorangehendem Text und dessen Übersetzung berücksichtigt. Größere Abschnitte erhöhen das Risiko von Wiederholungen oder Auslassungen."
  pt-BR: "Textos longos são divididos entre parágrafos em segmentos de até o tamanho indicado e traduzidos em ordem. Cada trecho usa até a quantidade definida do texto anterior e da tradução dele. Trechos maiores podem causar mais repetições ou omissões."
  id: "Teks panjang dibagi di antara paragraf menjadi segmen hingga ukuran ini, lalu diterjemahkan berurutan. Tiap segmen memakai teks sebelumnya dan terjemahannya hingga batas riwayat. Segmen lebih besar lebih mudah memicu pengulangan atau bagian yang terlewat."
